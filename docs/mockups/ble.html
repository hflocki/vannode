        const pos = ['Vorne links', 'Vorne rechts', 'Hinten links', 'Hinten rechts'];
        return {state: 'Vorne rechts: 3.21 bar zu niedrig', ok: false,
          rows: pos.map((n, i) => [n, p[i].toFixed(2) + ' bar · ' + (9 + i) + ' °C · ' + [100, 100, 62, 100][i] + ' % · ' + (20 + 7 * i) + ' s' + (i === 1 ? ' · ⚠' : ''), '']).concat(
                [[MAC(31), '2.10 bar · -88 dBm · nicht zugeordnet', '']])};
      }
      case 'govee':
        return {state: 'OK', ok: true,
          rows: [['Temperatur', 4.3, '°C'], ['Luftfeuchte', 71, '%'], ['Batterie', 100, '%'], ['Modell', 'H5072/H5075', ''], ['Bluetooth', -83, 'dBm'], ['Alter', 12, 's']]};
      case 'bthome':
        return {state: 'OK', ok: true,
          rows: [['Batterie', 87, '%'], ['Temperatur', 19.8, '°C'], ['Luftfeuchte', 54.2, '%'], ['Spannung', 2.91, 'V'], ['Bluetooth', -76, 'dBm'], ['Alter', 6, 's']],
          raw: '40 00 A5 01 57 02 BC 07 03 2C 15 0C 5E 0B'};
      case 'shelly':
        return {state: 'An', ok: true, gauge: {v: Math.round(wave(42, 3, 30)), unit: 'W', label: 'Leistung - an', max: 2000},
          rows: [['Spannung', 12.6, 'V'], ['Strom', 3.33, 'A'], ['Energie', 1.27, 'kWh'], ['Gerätetemperatur', 31, '°C'], ['Bluetooth', -71, 'dBm'], ['Gerät', 'Plus1PM', '']],
          ctrl: [{t: 'switch', k: 'output', l: 'Schalter', v: true}]};
      case 'blesensor':
        return {state: 'OK', ok: true,
          rows: [['Temperatur', Math.round(wave(21.4, 0.3, 60) * 10) / 10, '°C'], ['Luftfeuchte', 58, '%'], ['Batterie', 87, '%'], ['Bluetooth', -77, 'dBm'], ['Alter', 4, 's']],
          raw: '0: 56 34 12 38  4: C1 A4 5C 08  8: A8 16 1E 0B  12: 57 C2 0F'};
    }
    return {state: 'Warte auf Daten', ok: false, rows: []};
  },
  state() {
    const t = (Date.now() - M.t0) / 1000;
    // live data: only what runs in this boot (pending devices start with the restart)
    const runs = p => p.running && !p.removed;
    const plugins = M.cfg.plugins.filter(p => !p.pending && !p.removed).map(p => {
      const o = {id: p.id, name: p.cfg.name, type: p.type, enabled: runs(p)};
      if (!o.enabled) return o;
      if (!p.cfg.mac) return Object.assign(o, {state: 'Keine MAC eingestellt', ok: false, rows: []});
      return Object.assign(o, M.live(p, t));
    });
    return {rssi: -58, uptime: M.up(), heap: 98000, wifi_drops: 0, wifi_reason: '', wifi: 'Verbunden', mqtt: true,
            ble: {adv: 1200 + Math.floor((Date.now() - M.t0) / 100), scanning: true}, plugins};
  }
};

// Mockup runtime: replaces the device API (fetch, WebSocket, upload) with a simulation.
// The device script before this one defines M = {config, state(), route(), wsCmd(), wsOpen()}.
(function () {
  const KEY = 'mock:' + (M.id || location.pathname);
  // Settings survive the "restart" reload of the page (per browser tab only).
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
  M.cfg = Object.assign({}, M.config, saved);
  M.save = function (patch) {
    Object.assign(M.cfg, patch);
    Object.assign(saved, patch);
    try { sessionStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
  };
  M.t0 = Date.now();
  M.up = () => (M.uptime0 || 93780) + Math.floor((Date.now() - M.t0) / 1000);

  const json = (o, status) => Promise.resolve(new Response(typeof o === 'string' ? o : JSON.stringify(o),
    { status: status || 200, headers: { 'Content-Type': typeof o === 'string' ? 'text/plain' : 'application/json' } }));
  function bodyOf(opt) {
    const b = opt && opt.body;
    if (!b) return {};
    if (typeof b === 'string') {
      try { return JSON.parse(b); } catch (e) { return Object.fromEntries(new URLSearchParams(b)); }
    }
    if (b instanceof URLSearchParams || b instanceof FormData) return Object.fromEntries(b);
    return {};
  }
  window.fetch = function (url, opt) {
    opt = opt || {};
    const u = new URL(url, location.href);
    const method = (opt.method || 'GET').toUpperCase();
    const body = bodyOf(opt);
    const r = M.route ? M.route(u.pathname, method, body, u.searchParams) : undefined;
    if (r !== undefined) return json(r);
    // firmware info and event log (fwcheck / evlog), the same example for every device
    if (u.pathname === '/api/time' && method === 'POST') return json({ok: true});
    if (u.pathname === '/api/system' && method === 'GET') {
      const S3 = M.id === 'level' || M.id === 'display';
      const chip = M.chip || (S3 ? 'esp32s3' : 'esp32c3');   // M.chip: device script may set its chip
      const chipId = {esp32: 0, esp32s3: 9, esp32c3: 5}[chip] ?? 5;
      // M.fw: device script may add fields, e.g. name and dir for the about card (battery-node)
      // clock card: only the devices with a clock (clockset.h), here set from the browser
      const clock = ['display', 'heater', 'ble', 'battery'].includes(M.id) ? {t: Math.floor(Date.now() / 1000), ok: true, src: 'browser'} : undefined;
      // ?lang=en in the mockup address shows the page in English (UI_LANG of the firmware)
      const lang = new URLSearchParams(location.search).get('lang') || 'de';
      return json({fw: Object.assign({dev: M.id, ver: (M.cfg && M.cfg.version) || '1.7.0', chip, chip_id: chipId, hw: M.hw || chip, max: 1966080, lang}, M.fw || {}),
                   clock, up: 5400, log: [
        {b: 0, t: 5380, m: 'MQTT verbunden'}, {b: 0, t: 5378, m: 'WLAN verbunden (192.168.8.31, -61 dBm)'},
        {b: 0, t: 3600, m: 'Update abgelehnt: das ist die .merged.bin (komplettes Flash-Abbild für USB) – bitte die .bin ohne „merged“ nehmen'},
        {b: 0, t: 3598, m: 'Firmware-Upload gestartet (1340 kB)'}, {b: 0, t: 3, m: 'MQTT verbunden'},
        {b: 0, t: 2, m: 'WLAN verbunden (192.168.8.31, -63 dBm)'}, {b: 0, t: 0, m: 'Start v' + ((M.cfg && M.cfg.version) || '1.7.0') + ', Grund: Neustart (Software)'},
        {b: 1, t: 812, m: 'Update auf v' + ((M.cfg && M.cfg.version) || '1.7.0') + ' ok (1187 kB), Neustart'}, {b: 1, t: 0, m: 'Start v1.6.0, Grund: Einschalten'}]});
    }
    if (u.pathname === '/api/config' && method === 'GET') return json(M.cfg);
    if (u.pathname === '/api/config' && method === 'POST') {
      const p = Object.assign({}, body);
      for (const k of Object.keys(p)) if (/pass|token/i.test(k)) delete p[k];  // never echo secrets
      M.save(p);
      return json({ ok: true });
    }
    return json({ ok: true });
  };

  // WebSocket: pushes M.state() every M.wsInterval ms, M.wsCmd() gets what the page sends
  class FakeWS {
    constructor() {
      this.readyState = 0;
      setTimeout(() => {
        this.readyState = 1;
        if (this.onopen) this.onopen({});
        if (M.wsOpen) M.wsOpen((o) => this._emit(o));
        this._tick();
      }, 120);
      this._timer = setInterval(() => this._tick(), M.wsInterval || 1000);
    }
    _emit(o) { if (this.onmessage) this.onmessage({ data: JSON.stringify(o) }); }
    _tick() { if (M.state) this._emit(M.state()); }
    send(d) {
      let o = d;
      try { o = JSON.parse(d); } catch (e) {}
      const reply = M.wsCmd ? M.wsCmd(o) : null;
      if (reply) this._emit(reply);
      setTimeout(() => this._tick(), 150);
    }
    close() { clearInterval(this._timer); this.readyState = 3; }
    addEventListener(ev, fn) { this['on' + ev] = fn; }
  }
  FakeWS.CONNECTING = 0; FakeWS.OPEN = 1; FakeWS.CLOSING = 2; FakeWS.CLOSED = 3;
  window.WebSocket = FakeWS;

  // File upload: simulated progress, answers like the firmware ("OK" or "OK web" for a .gz page)
  class FakeXHR {
    constructor() { this.upload = {}; this.status = 0; this.responseText = ''; }
    open(m, u) { this._u = u; }
    setRequestHeader() {}
    send(fd) {
      let name = '';
      try { for (const v of fd.values()) if (v && v.name) name = v.name; } catch (e) {}
      let p = 0;
      const iv = setInterval(() => {
        p += 25;
        if (this.upload.onprogress) this.upload.onprogress({ lengthComputable: true, loaded: p, total: 100 });
        if (p >= 100) {
          clearInterval(iv);
          this.status = 200;
          this.responseText = /\.gz$/i.test(name) ? 'OK web' : 'OK';
          if (this.onload) this.onload();
        }
      }, 250);
    }
  }
  window.XMLHttpRequest = FakeXHR;

  // Dialogs are blocked in some embedded viewers; the mockup always answers "yes"
  window.confirm = () => true;
  window.alert = (m) => console.log('[alert]', m);

  // Banner
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.textContent = 'Mockup mit Beispieldaten – keine Verbindung zu einem Gerät';
    b.style.cssText = 'position:sticky;top:0;z-index:9999;background:#d4a017;color:#000;text-align:center;font:600 12px system-ui;padding:4px';
    document.body.prepend(b);
    // body as a flex row (e.g. BLE node on wide screens): the bar would become a column,
    // so it is fixed on top and the body moves down by its height
    const cs = getComputedStyle(document.body);
    if (cs.display.includes('flex') && !cs.flexDirection.startsWith('column')) {
      b.style.position = 'fixed'; b.style.left = '0'; b.style.right = '0';
      document.body.style.paddingTop = ((parseFloat(cs.paddingTop) || 0) + b.offsetHeight) + 'px';
    }
  });
})();

    <title>VanNode BLE</title>
    <style>
      /* Same look as the other VanNode devices (battery, tanklevel, temp ...) */

      .tanks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }

        border-radius: 6px; overflow: hidden; background: var(--bg-card); }
      .tank .vessel i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: height 0.4s; }
      .card.ok .tank .vessel i { background: var(--success); }
      .tank.free .vessel { background: repeating-linear-gradient(45deg, var(--bg-card) 0 4px, var(--bg-input) 4px 8px); }
      .tank .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
      .card.ok .tank .v { color: var(--success); }
      .tank .s { font-size: 0.7rem; color: var(--text-secondary); overflow-wrap: anywhere; }
      .tank .r { font-size: 0.6rem; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
      .tank.off { opacity: 0.45; }

      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

      .tile span { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile b { font-size: 1rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      @media (max-width: 374px) { .tiles { grid-template-columns: 1fr 1fr; } header { padding: 14px 12px; } }
      .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

      .ctl input[type="range"] { flex: 1; accent-color: var(--accent); }

      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      /* Buttons */
      button.b {
        display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 12px;
        padding: 10px 16px; border-radius: 8px; font: inherit; font-size: 0.85rem; font-weight: 600;
        cursor: pointer; border: none; background: var(--accent); color: var(--bg-primary);
      }
      button.b.s { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); }
      button.b.d { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); }
      .row button.b, .ctl button.b, .dev button.b { margin-top: 0; }
      .ctl .row button.b { padding: 8px 6px; }
      .dev button.b, .f .row button.b { width: auto; padding: 8px 12px; font-size: 0.75rem; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      /* Toggle switch (checkboxes) */
      input[type="checkbox"] {
        appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0;

      }
      input[type="checkbox"]:checked { background: var(--accent); }

      /* Forms */
      .f { margin-bottom: 12px; }
      .f > span { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }

      .mute { color: var(--text-muted); font-size: 0.8rem; }

      table { width: 100%; border-collapse: collapse; }

      .dev {

      .fwu-chk.ok { color: var(--ok); }
      .fwu-chk.warn { color: var(--warn); }
      .fwu-chk.bad { color: var(--bad); }

      .fwu-force { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; margin: 0 0 8px; }
      .fwu-log { font-size: 0.75rem; line-height: 1.4; max-height: 320px; overflow-y: auto; }

      .fwu-ev:last-child { border-bottom: 0; }

/* VanNode design (same look as the display): calm and technical, colour means state,
   blue means control. Shared block, edit firmware/_common/web/camper-theme.css and run
   tools/common/sync_common.py; it overrides the page's own styles above it. */
:root{
 --bg-primary:#0D1115;--bg-secondary:#11161B;--bg-card:#151B21;--bg-input:#0D1115;--border:#222B34;--radius:14px;
 --accent:#4DA3F0;--accent-glow:rgba(77,163,240,.25);--success:#46B97C;--warning:#E5A23B;--danger:#E5534B;
 --text-primary:#E7ECF0;--text-secondary:#B4BEC8;--text-muted:#8B98A5;
 --water:#3E9BE0;--water-glow:rgba(62,155,224,.25);--gas:#D9893A;--grey:#8A96A3;
 --cold:#3E9BE0;--mild:#46B97C;--warm:#E5A23B;--hot:#E5534B;
 --bg:#0D1115;--bg2:#11161B;--card:#151B21;--input:#0D1115;--acc:#4DA3F0;--acc-glow:rgba(77,163,240,.25);--warn:#E5A23B;
 --ok:#46B97C;--ink:#E7ECF0;--mute:#8B98A5;--dim:#6F7C89;--line:#222B34;--r:14px;--bad:#E5534B;
 --cm-line2:#2F3A45;--cm-hi:#1C242C;--cm-acx:#06131F;color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4}
svg.i{width:20px;height:20px;flex:none;vertical-align:-4px}
.header{background:var(--bg-primary);padding:14px 16px;border-bottom:1px solid var(--border);gap:12px}
.header h1{font-size:1.15rem;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:10px;min-width:0}
.header h1 svg.i{color:var(--accent)}
.status-dots{gap:6px;font-size:.75rem;color:var(--text-primary);flex-wrap:wrap;justify-content:flex-end}
.status-dots>span{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-hi)}
.status-dot{width:8px;height:8px;margin-right:6px;background:var(--cm-line2);box-shadow:none}
.status-dot.active{background:var(--success);box-shadow:none}
.status-dot.warning{background:var(--warning)}
.tabs{background:var(--bg-primary);border-bottom:1px solid var(--border);padding:8px 8px 0;gap:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.72rem;color:var(--text-muted);border-bottom:2px solid transparent;border-radius:10px 10px 0 0;padding:8px 2px 8px;gap:4px}
.tab .ico{display:inline-flex;font-size:1.05rem}
.tab .ico svg.i{width:20px;height:20px}
.tab.active,.tab.gas.active,.tab.grey.active{color:var(--text-primary);border-bottom-color:var(--accent);background:var(--cm-hi);font-weight:600}
.tab.active .ico{color:var(--accent)}
.tab-content{padding:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}

.value-num{font-size:1.35rem;font-weight:600}
.info-row{padding:10px 0;font-size:.9rem}
.info-label{color:var(--text-muted)}

.form-group input,.form-group select,.form-group textarea{min-height:40px;padding:9px 12px;background:var(--bg-input);border:1px solid var(--cm-line2);border-radius:10px;font-size:.95rem;color:var(--text-primary)}

.btn-secondary{background:var(--cm-hi);color:var(--text-primary);border:1px solid var(--cm-line2)}

.btn-small{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:9px}

.empty{color:var(--text-muted)}
.toast{background:var(--text-primary);color:var(--bg-primary);border:0;border-radius:10px}

.alarm-banner{background:#2A2213;border-color:#4A3A1C;color:#F6D9A3}

    <script>
      const $ = (s) => document.querySelector(s),
        el = (t, a = {}, ...c) => {
          const e = document.createElement(t);
          for (const k in a) {
            if (k == "on")
              for (const ev in a.on) e.addEventListener(ev, a.on[ev]);
            else if (k in e && k != "list") e[k] = a[k];
            else e.setAttribute(k, a[k]);
          }
          for (const x of c) if (x != null) e.append(x);
          return e;
        };
      let CFG = null,
        LIVE = null,
        tab = "live",
        ws = null;
      const TX = {
        34: "8,5 dBm",
        44: "11 dBm",
        52: "13 dBm",
        60: "15 dBm",
        70: "17,5 dBm",
        78: "19,5 dBm",
      };
      function toast(t, err) {
        const x = $("#toast");
        x.textContent = t;
        x.classList.toggle("err", !!err);
        x.classList.add("show");
        clearTimeout(x._t);
        x._t = setTimeout(() => x.classList.remove("show"), 2500);
      }
      async function api(url, body) {
        const r = await fetch(
          url,
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              },
        );
        let j = {};
        try {
          j = await r.json();
        } catch (e) {}
        if (!r.ok) throw new Error(j.error || r.statusText);
        return j;
      }
      function fmt(v, u) {
        if (v === null || v === undefined) return "–";
        if (typeof v == "number") v = v.toLocaleString("de-DE");
        return v + (u ? " " + u : "");

      // stroke icons as in all VanNode pages (no emoji)
      const svg = (k) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${SVGP[k] || SVGP.plug}"/></svg>`;
      const ICONS = { rvtech: "hatch", pump: "pump", fridge: "snow", dimes: "fire", mopeka: "fire", mopeka_std: "fire", blesensor: "radio", govee: "radio", bthome: "radio", daly: "plug", ective: "plug", bm2: "plug", jbd: "plug", jk: "plug", litime: "plug", trumalc: "fire", senso4s: "fire", victron: "plug" };
      function tabs() {

        const t = [
          ["live", "Live", "chart"],
          ["dev", "Geräte", "plug"],
          ["ble", "Bluetooth", "radio"],
          ["wifi", "WLAN", "wifi"],
          ["mqtt", "MQTT", "sliders"],
          ["sys", "System", "sys"],
        ];
        // Debug tab only with the setting System -> Debug
        if (CFG.core && CFG.core.debug) t.push(["dbg", "Debug", "bug"]);
        else if (tab == "dbg") tab = "sys";
        $("#nav").replaceChildren(
          ...t.map(([k, l, ico]) =>
            el(
              "button",
              {
                className: tab == k || (k == "dev" && tab.startsWith("p:")) ? "on" : "",
                title: l,
                on: {
                  click: () => {
                    tab = k;
                    render();
                  },
                },
              },
              Object.assign(el("span", { className: "ico" }), { innerHTML: svg(ico) }),
              el("span", {}, l),
            ),
          ),
        );
      }
      function render() {
        tabs();
        const m = $("#main");
        m.replaceChildren();
        if (CFG.safe)
          m.append(
            el(
              "div",
              { className: "card", style: "border:1px solid var(--warning)" },
              el("b", { style: "color:var(--warning)" }, "Sicherer Start – alle Geräte sind aus"),
              el(
                "small",
                { style: "display:block;margin-top:6px" },
                "Der Node wurde mehrmals schnell hintereinander gestartet. Unter Geräte das Gerät abschalten, das Probleme macht, dann neu starten. Ohne Änderung laufen nach dem nächsten Neustart wieder alle Geräte.",
              ),
            ),
          );
        if (tab == "live") renderLive();
        else if (tab == "dev") renderPlugins();
        else if (tab.startsWith("p:")) {
          const p = CFG.plugins.find((x) => "p:" + x.id == tab);
          if (p && !p.removed && !fieldsOf(p).length && !SCHEMA[p.type]) {
            // Field descriptions not loaded yet: fetch them, then draw the page
            const want = tab;
            m.append(el("div", { className: "card" }, "Einstellungen werden geladen …"));
            loadSchema(p.type)
              .then(() => { if (tab == want) render(); })
              .catch((e) => {
                if (tab != want) return;
                m.replaceChildren(el("div", { className: "card" }, "Fehler: " + e.message));
              });
          } else if (p && !p.removed) renderPlugin(p);
          else {
            tab = "dev";
            return render();
          }
        }
        else if (tab == "ble") renderBle();
        else if (tab == "wifi") renderWifi();
        else if (tab == "mqtt") renderMqtt();
        else if (tab == "dbg") renderDebug();
        else renderSys();
      }

      // ---------------- Live ----------------
      let ctlTouch = 0; // last time a live control was used
      const pending = {}; // value sent with - / +, shown until the device reports it (max 10 s)
      document.addEventListener("pointerdown", () => (ctlTouch = Date.now()), true);
      function cmd(p, k, v) {
        api("/api/cmd", { p, k, v: String(v) }).catch((e) => toast(e.message, true));
      }
      function renderLive() {
        const g = el("div", { className: "grid", id: "live" });
        $("#main").append(g);
        if (!CFG.plugins.length)
          g.append(
            el(
              "div",
              { className: "card" },
              "Noch kein Gerät angelegt – unter Geräte mit „+ Gerät hinzufügen“.",
            ),
          );
        else if (!CFG.plugins.some((p) => p.cfg.enabled))
          g.append(
            el(
              "div",
              { className: "card" },
              "Alle Geräte sind ausgeschaltet – unter Geräte einschalten.",
            ),
          );
        updateLive();
      }
      function updateLive() {
        const g = $("#live");
        if (!g || !LIVE) return;
        const a = document.activeElement;
        // Do not disturb a control that is in use (open select, slider being dragged).
        // Controls lose focus after a change, so the view never freezes afterwards.
        if (a && g.contains(a) && (a.type == "range" || a.tagName == "SELECT") && Date.now() - ctlTouch < 15000)
          return;
        if (a && g.contains(a) && a.type == "text") return; // Text being typed: no redraw
        g.replaceChildren(...LIVE.plugins.filter((p) => p.enabled).map(card));
      }
      function card(p) {
        const c = el("div", { className: "card dev-card" + (p.enabled && p.ok ? " ok" : "") });
        c.append(
          el(
            "h2",
            {},
            p.name,
            el("span", {
              className: "state" + (p.ok ? " ok" : ""),
              textContent: p.enabled ? p.state || "" : "Aus",
            }),
          ),
        );
        if (!p.enabled) {
          c.append(
            el(
              "div",
              { className: "mute" },
              "Unter Geräte einschalten.",
            ),
          );
          return c;
        }
        if (p.gauge) {
          const G = p.gauge,
            min = G.min ?? 0,
            max = G.max ?? 100,
            pct =
              G.v == null
                ? 0
                : Math.max(0, Math.min(100, ((G.v - min) / (max - min)) * 100));
          c.append(
            el(
              "div",
              { className: "gauge" },
              el("div", { className: "v" }, fmt(G.v, G.unit)),
              el("div", { className: "l" }, G.label || ""),
              el(
                "div",
                { className: "bar" },
                el("i", { style: "width:" + pct + "%" }),
              ),
            ),
          );
        }
        if (p.tanks)
          c.append(
            el(
              "div",
              { className: "tanks" },
              ...p.tanks.map((t) =>
                el(
                  "div",
                  { className: "tank" + (t.off ? " off" : "") + (t.free ? " free" : "") },
                  el("div", { className: "l", title: t.l }, t.l),
                  el(
                    "div",
                    { className: "vessel" },
                    el("i", { style: "height:" + Math.max(0, Math.min(100, t.p || 0)) + "%" }),
                  ),
                  el("div", { className: "v" }, t.off ? "–" : fmt(t.v, t.u)),
                  el("div", { className: "s" }, t.s || ""),
                  t.r != null ? el("div", { className: "r" }, "Roh " + t.r) : "",
                ),
              ),
            ),
          );
        // Main switch of a device (e.g. whole fridge) above its compartments
        const top = (p.ctrl || []).filter((x) => x.top);
        if (top.length) {
          const box = el("div", { className: "ctl" });
          for (const x of top) box.append(ctrl(p.id, x));
          c.append(box);
        }
        if (p.zones)
          c.append(
            el(
              "div",
              { className: "zones" },
              ...p.zones.map((z) =>
                el(
                  "div",
                  { className: "zone" + (z.k && !z.on ? " off" : "") },
                  el("div", { className: "l" }, z.l),
                  el("div", { className: "v" }, fmt(z.v, z.unit)),
                  z.step ? step(p.id, z.step) : el("div", { className: "s" }, z.s || ""),
                  z.k ? ctrl(p.id, { t: "switch", k: z.k, l: "An", v: z.on }) : "",
                ),
              ),
            ),
          );
        if (p.rows)
          c.append(
            el(
              "div",
              { className: "tiles" },
              ...p.rows.map((r) =>
                el("div", { className: "tile" }, el("span", {}, r[0]), el("b", {}, fmt(r[1], r[2]))),
              ),
            ),
          );
        // Short history, e.g. the last errors of the fridge
        if (p.list && p.list.items && p.list.items.length)
          c.append(
            el(
              "details",
              {},
              el("summary", {}, p.list.l + " (" + p.list.items.length + ")"),
              ...p.list.items.map((t) => el("div", { className: "raw" }, t)),
            ),
          );
        if (p.ctrl) {
          const box = el("div", { className: "ctl" });
          for (const x of p.ctrl) if (!x.top) box.append(ctrl(p.id, x));
          c.append(box);
        }
        if (p.raw)
          c.append(
            el(
              "details",
              {},
              el("summary", {}, "Rohdaten"),
              el("div", { className: "raw" }, p.raw),
            ),
          );
        return c;
      }
      // Set point with - / + buttons; each press sends the new value at once
      function step(id, x) {
        const key = id + "/" + x.k,
          p = pending[key];
        if (p && (p.v == x.v || Date.now() - p.t > 10000)) delete pending[key];
        let v = pending[key] ? pending[key].v : x.v;
        const out = el("b", { textContent: "Soll " + v + " °C" });
        const go = (d) => {
          const n = Math.max(x.min, Math.min(x.max, v + d * (x.d || 1)));
          if (n == v) return;
          v = n;
          pending[key] = { v, t: Date.now() };
          out.textContent = "Soll " + v + " °C";
          cmd(id, x.k, v);
        };
        return el(
          "div",
          { className: "step" },
          el("button", { className: "b s", textContent: "−", title: "1 °C kälter", on: { click: () => go(-1) } }),
          out,
          el("button", { className: "b s", textContent: "+", title: "1 °C wärmer", on: { click: () => go(1) } }),
        );
      }
      const textVal = {}; // last text of text controls, kept over live redraws
      function ctrl(id, x) {
        if (x.t == "text") {
          // Free text with a send button (diagnosis)
          const key = id + "/" + x.k;
          const i = el("input", { type: "text", value: textVal[key] || "", placeholder: x.ph || "" });
          i.style.flex = "1";
          i.style.minWidth = "8em";
          const send = () => {
            const v = i.value.trim();
            if (!v) return;
            textVal[key] = v;
            cmd(id, x.k, v);
            i.blur();
          };
          i.addEventListener("keydown", (e) => {
            if (e.key == "Enter") send();
          });
          const d = el("label", {}, x.l + " ", i, el("button", { className: "b s", textContent: "Senden", on: { click: send } }));
          d.style.flex = "1 1 100%";
          return d;
        }
        if (x.t == "switch") {
          const i = el("input", {
            type: "checkbox",
            checked: !!x.v,
            on: {
              change: (e) => cmd(id, x.k, e.target.checked ? "ON" : "OFF"),
            },
          });
          return el("label", {}, x.l, i);
        }
        if (x.t == "select") {
          const o = x.o.split("|");
          const s = el(
            "select",
            {
              on: {
                change: (e) => {
                  cmd(id, x.k, e.target.value);
                  e.target.blur();
                },
              },
            },
            ...o.map((t, i) =>
              el("option", { value: t, textContent: t, selected: i == x.v }),
            ),
          );
          s.style.width = "auto";
          return el("label", {}, x.l, s);
        }
        if (x.t == "buttons") {
          const d = el("div", { className: "row" });
          for (const [k, l] of x.b)
            d.append(
              el("button", {
                className: "b s",
                textContent: l,
                on: { click: () => cmd(id, x.k, k) },
              }),
            );
          d.style.flex = "1 1 100%";
          return d;
        }
        if (x.t == "slider") {
          const out = el("span", { textContent: x.v });
          const r = el("input", {
            type: "range",
            min: x.min,
            max: x.max,
            value: x.v,
            on: {
              input: (e) => (out.textContent = e.target.value),
              change: (e) => {
                cmd(id, x.k, e.target.value);
                e.target.blur();
              },
            },
          });
          return el("label", {}, x.l + " ", r, out);
        }
        return el("span");
      }

      // ---------------- Plugin settings ----------------
      function field(f, val) {
        let i;
        if (f.t == "bool")
          i = el("input", { type: "checkbox", checked: !!val });
        else if (f.t == "select")
          i = el(
            "select",
            {},
            ...f.o
              .split("|")
              .map((t, n) =>
                el("option", { value: n, textContent: t, selected: n == val }),
              ),
          );
        else if (f.t == "float" || f.t == "int")
          i = el("input", {
            type: "number",
            min: f.min,
            max: f.max,
            step: f.t == "int" ? 1 : f.step,
            value: val,
          });
        else
          i = el("input", {
            type: "text",
            value: val ?? "",
            maxLength: f.t == "mac" ? 17 : f.max,
            placeholder: f.t == "mac" ? "AA:BB:CC:DD:EE:FF" : "",
          });
        i.dataset.k = f.k;
        i.dataset.t = f.t;
        const lab = el("span", {}, f.l + (f.u ? " (" + f.u + ")" : ""));
        const w = el("div", { className: "f" }, lab);
        if (f.t == "mac") {
          const r = el(
            "div",
            { className: "row" },
            i,
            el("button", {
              className: "b s",
              type: "button",
              textContent: "Suchen",
              style: "flex:0 0 auto",
              on: { click: () => pick(i, w) },
            }),
          );
          w.append(r);
        } else w.append(i);
        if (f.h) w.append(el("small", {}, f.h));
        return w;
      }
      function readFields(box) {
        const o = {};
        for (const i of box.querySelectorAll("[data-k]")) {
          const t = i.dataset.t;
          o[i.dataset.k] =
            t == "bool"
              ? i.checked
              : t == "select"
                ? +i.value
                : t == "int" || t == "float"
                  ? +i.value
                  : i.value.trim();
        }
        return o;
      }
      // Field descriptions per type, fetched from /api/schema when a device page is opened
      // (2.6.2; before in /api/config under "schemas", which made that answer too large)
      const SCHEMA = {};
      const fieldsOf = (p) => SCHEMA[p.type] || (CFG.schemas && CFG.schemas[p.type]) || p.fields || [];
      async function loadSchema(type) {
        if (SCHEMA[type] || (CFG.schemas && CFG.schemas[type])) return;
        const r = await api("/api/schema?type=" + encodeURIComponent(type));
        SCHEMA[type] = r.fields || [];
      }
      function openDevice(id) {
        tab = "p:" + id;
        render();
        window.scrollTo(0, 0);
      }
      function restartButton() {
        return el("button", {
          className: "b",
          textContent: "Jetzt neu starten",
          on: {
            click: (e) => {
              e.target.disabled = true;
              api("/api/restart", {})
                .then(() => {
                  toast("Neustart…");
                  setTimeout(() => location.reload(), 8000);
                })
                .catch((x) => {
                  e.target.disabled = false;
                  toast(x.message, true);
                });
            },
          },
        });
      }
      function renderPlugin(p) {
        $("#main").append(
          el("button", {
            className: "b s",
            textContent: "← Alle Geräte",
            style: "width:auto;margin:0 0 10px;padding:4px 12px",
            on: { click: () => { tab = "dev"; render(); } },
          }),
        );
        const c = el("div", { className: "card" });
        c.append(
          el(
            "h2",
            {},
            p.cfg.name || p.type_name,
            el("span", { className: "mute", textContent: p.type_name + " · ID: " + p.id }),
          ),
        );
        if (!p.running)
          c.append(
            el(
              "div",
              { className: "f", style: "padding:10px 12px;border-radius:8px;background:rgba(229,162,59,.12)" },
              el(
                "small",
                { style: "display:block;margin-bottom:8px;color:var(--warning)" },
                p.pending
                  ? "Neu angelegt – läuft erst nach dem Neustart. Einstellungen kannst du schon jetzt speichern, mehrere neue Geräte brauchen nur einen Neustart."
                  : p.cfg.enabled
                    ? "Läuft erst nach dem Neustart. Einstellungen kannst du schon jetzt speichern."
                    : "Ausgeschaltet (unter Geräte einschalten). Einstellungen kannst du trotzdem speichern.",
              ),
              p.pending || p.cfg.enabled ? restartButton() : null,
            ),
          );
        const nm = el("input", {
          type: "text",
          value: p.cfg.name,
          maxLength: 31,
        });
        c.append(
          el(
            "div",
            { className: "f" },
            el("span", {}, "Name (Anzeige und Home Assistant)"),
            nm,
          ),
        );
        const box = el("div");
        // Expert fields (x, FF_EXPERT in plugin.h) sit in their own block behind a switch.
        // The switch is not saved; it starts on when one of these fields is not empty.
        const fs = fieldsOf(p);
        const xs = fs.filter((f) => f.x);
        for (const f of fs) if (!f.x) box.append(field(f, p.cfg[f.k]));
        if (xs.length) {
          const xbox = el("div");
          for (const f of xs) xbox.append(field(f, p.cfg[f.k]));
          const used = xs.some((f) => (f.t == "text" || f.t == "mac") && String(p.cfg[f.k] ?? "").trim() !== "");
          xbox.hidden = !used;
          const sw = el("input", {
            type: "checkbox",
            checked: used,
            on: { change: (e) => (xbox.hidden = !e.target.checked) },
          });
          box.append(
            el(
              "div",
              { className: "f" },
              el("label", { style: "display:flex;gap:8px;align-items:center" }, sw, "Expertenmodus"),
              el("small", {}, "Zeigt Einstellungen, die nur bei Problemen nötig sind (z. B. Bluetooth-UUIDs). Leer lassen = Standard."),
            ),
            xbox,
          );
        }
        c.append(box);
        c.append(
          el("button", {
            className: "b",
            textContent: "Speichern",
            on: {
              click: async () => {
                const cfg = readFields(box);
                cfg.name = nm.value.trim();
                try {
                  const r = await api("/api/config", { plugin: p.id, cfg });
                  toast(r.restart ? "Gespeichert – Neustart…" : "Gespeichert");
                  Object.assign(p.cfg, cfg);
                  if (r.restart) setTimeout(() => location.reload(), 8000);
                  else render();
                } catch (e) {
                  toast(e.message, true);
                }
              },
            },
          }),
        );
        $("#main").append(c);
        if (p.ble === 2) renderLog(p);
      }
      // Device log of a connecting BLE device: download as "<name>_<date>_<time>.log", or clear
      function renderLog(p) {
        const clean = (s) =>
          s
            .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
            .replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/ß/g, "ss")
            .replace(/[^A-Za-z0-9_-]+/g, "_")
            .replace(/^_+|_+$/g, "") || p.id;
        const two = (n) => String(n).padStart(2, "0");
        const download = async () => {
          try {
            const r = await fetch("/api/log?id=" + encodeURIComponent(p.id));
            if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
            const d = new Date();
            const date = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
            const time = two(d.getHours()) + "-" + two(d.getMinutes());
            const live = LIVE && LIVE.plugins ? LIVE.plugins.find((x) => x.id == p.id) : null;
            const text =
              "# Download " + d.toLocaleString("de-DE") + "\n" +
              "# Live " + JSON.stringify(live || {}) + "\n" +
              (await r.text());
            const a = el("a", {
              href: URL.createObjectURL(new Blob([text], { type: "text/plain" })),
              download: clean(p.cfg.name || p.type_name) + "_" + date + "_" + time + ".log",
            });
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          } catch (e) {
            toast(e.message, true);
          }
        };
        const clear = async () => {
          try {
            const r = await fetch("/api/log/clear?id=" + encodeURIComponent(p.id), { method: "POST" });
            if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
            toast("Log geleert");
          } catch (e) {
            toast(e.message, true);
          }
        };
        $("#main").append(
          el(
            "div",
            { className: "card" },
            el("h2", {}, "Log"),
            el(
              "small",
              { className: "mute" },
              "Verbindung, Kopplung, Bluetooth-Dienste und empfangene Daten dieses Geräts. " +
                "Wird bei einem Neustart gelöscht. Bei Problemen: Log leeren, Fehler abwarten " +
                "(z. B. 3 Minuten), dann herunterladen und schicken.",
            ),
            el(
              "div",
              { style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap" },
              el("button", { className: "b", textContent: "Log herunterladen", on: { click: download } }),
              el("button", { className: "b s", textContent: "Log leeren", on: { click: clear } }),
            ),
          ),
        );
      }
      async function pick(input, wrap) {
        let list = wrap.querySelector(".picker");
        if (list) {
          list.remove();
          return;
        }
        list = el(
          "div",
          { className: "picker" },
          el("div", { className: "mute" }, "Suche…"),
        );
        wrap.append(list);
        try {
          const j = await api("/api/scan");
          const pt = CFG.plugins.find((p) => "p:" + p.id == tab).type;
          if (!j.active) {
            list.replaceChildren(
              el(
                "div",
                { className: "mute" },
                "Bluetooth ist aus (Plugin aktivieren und speichern).",
              ),
            );
            return;
          }
          const devs = j.devices.sort(
            (a, b) =>
              b.fits.includes(pt) - a.fits.includes(pt) || b.rssi - a.rssi,
          );
          list.replaceChildren(
            ...devs.map((d) =>
              el(
                "div",
                { className: "dev" },
                el(
                  "span",
                  {},
                  el("b", {}, d.mac),
                  " ",
                  d.name || "",
                  d.use ? el("span", { className: "tag" }, d.use) : "",
                  d.fits.includes(pt) ? " ✔ passt" : "",
                ),
                el(
                  "span",
                  {},
                  d.rssi + " dBm ",
                  el("button", {
                    className: "b s",
                    textContent: "Wählen",
                    on: {
                      click: () => {
                        input.value = d.mac;
                        list.remove();
                      },
                    },
                  }),
                ),
              ),
            ),
          );
          if (!devs.length)
            list.replaceChildren(
              el("div", { className: "mute" }, "Noch keine Geräte gefunden."),
            );
        } catch (e) {
          list.replaceChildren(el("div", { className: "mute" }, e.message));
        }
      }

      // ---------------- Bluetooth ----------------
      async function renderBle() {
        const c = el(
          "div",
          { className: "card" },
          el("h2", {}, "Geräte in der Nähe"),
          el("div", { className: "mute" }, "Lade…"),
        );
        $("#main").append(c);
        try {
          const j = await api("/api/scan");
          if (!j.active) {
            c.lastChild.textContent =
              "Bluetooth ist aus – kein aktives Bluetooth-Plugin.";
            return;
          }

          "div",
          { className: "f" },

      function saveCore(box) {
        return async () => {
          const core = readFields(box);
          for (const k of ["wifi_pass", "mqtt_pass", "ap_pass", "web_pass"])
            if (k in core && core[k] === "") delete core[k];
          try {
            const r = await api("/api/config", { core });
            toast(r.restart ? "Gespeichert – Neustart…" : "Gespeichert");
            if (r.restart) setTimeout(() => location.reload(), 10000);
            else load();
          } catch (e) {
            toast(e.message, true);
          }
        };
      }

      function renderPlugins() {
        const max = CFG.max_links || 3,
          maxDev = CFG.max_devices || 12,
          types = CFG.types || [];
        // Device changes are saved right away and take effect with the next restart
        // While a change is on its way all buttons of the list are locked (no double add)
        let busy = false;
        const save = async (body, msg) => {
          if (busy) return;
          busy = true;
          for (const b of $("#main").querySelectorAll("button")) b.disabled = true;
          const before = new Set(CFG.plugins.map((p) => p.id));
          let saved = false;
          try {
            await api("/api/config", body);
            saved = true;
            toast(msg);
            await new Promise((r) => setTimeout(r, 300)); // the device applies it in its main loop
            const keep = window.scrollY;
            await load();
            // a new device: straight to its settings
            const added = body.add && CFG.plugins.find((p) => !before.has(p.id));
            if (added) openDevice(added.id);
            else window.scrollTo(0, keep);
          } catch (e) {
            if (!saved) {
              toast(e.message, true);
              return render();
            }
            // Saved on the device, but the new list did not come: do not show the old list
            // (adding again from it would create a second device)
            $("#main").replaceChildren(
              el(
                "div",
                { className: "card" },
                el("b", { style: "color:var(--warning)" }, "Gespeichert – die Geräteliste konnte nicht geladen werden"),
                el("small", { style: "display:block;margin:6px 0 10px" }, e.message),
                el("button", { className: "b", textContent: "Seite neu laden", on: { click: () => location.reload() } }),
              ),
            );
          }
        };
        const active = CFG.plugins.filter((p) => !p.removed);
        // one line per device: switch, name, state after the restart, type, remove / undo
        const mk = (p) => {
          const i = el("input", { type: "checkbox", checked: p.cfg.enabled && !p.removed, disabled: !!p.removed });
          i.dataset.id = p.id;
          let note = "";
          if (p.removed) note = el("span", { className: "badge err", textContent: "wird entfernt" });
          else if (p.pending) note = el("span", { className: "badge new", textContent: "neu" });
          else if (p.cfg.enabled !== p.running)
            note = el("span", { className: "badge new", textContent: p.cfg.enabled ? "wird eingeschaltet" : "wird ausgeschaltet" });
          const btn = p.removed
            ? el("button", {
                className: "b s",
                title: "Doch behalten",
                textContent: "Rückgängig",
                style: "width:auto;margin:0;padding:4px 10px",
                on: { click: () => save({ restore: p.id }, "Bleibt erhalten") },
              })
            : el("button", {
                className: "b d",
                title: "Entfernen",
                textContent: "✕",
                style: "width:auto;margin:0;padding:4px 10px",
                on: {
                  click: () => {
                    if (!confirm(`„${p.cfg.name}“ entfernen? Die Einstellungen und die Einträge in Home Assistant werden gelöscht.`)) return;
                    save({ remove: p.id }, "Entfernt");
                  },
                },
              });
          return el(
            "div",
            { className: "f", style: "display:flex;gap:8px;align-items:center" + (p.removed ? ";opacity:.6" : "") },
            el(
              "label",
              { style: "display:flex;gap:8px;align-items:center;flex:1;margin:0;flex-wrap:wrap" },
              i,
              el("span", { style: p.removed ? "text-decoration:line-through" : "" }, p.cfg.name),
              note,
              el("span", { className: "mute", style: "margin-left:auto", textContent: p.type_name }),
            ),
            p.removed
              ? null
              : el("button", {
                  className: "b s",
                  title: "Einstellungen",
                  textContent: "Einstellen",
                  style: "width:auto;margin:0;padding:4px 10px",
                  on: { click: () => openDevice(p.id) },
                }),
            btn,
          );
        };
        const listen = CFG.plugins.filter((p) => p.ble !== 2).map(mk);
        const link = CFG.plugins.filter((p) => p.ble === 2).map(mk);
        const boxes = [...listen, ...link];
        const count = el("span", { className: "mute" });
        // Connections: at most `max` switched on at the same time, further switches are locked
        const linkOn = () => link.filter((b) => b.querySelector("input").checked).length;
        const check = () => {
          const on = linkOn();
          count.textContent = `${on} von ${max}`;
          for (const b of link) {
            const i = b.querySelector("input");
            const gone = CFG.plugins.find((p) => p.id === i.dataset.id).removed;
            i.disabled = gone || (!i.checked && on >= max);
          }
          for (const o of sel.options) {
            const t = types.find((x) => x.type === o.value);
            o.disabled = (t && t.ble === 2 && on >= max) || active.length >= maxDev;
          }
        };
        for (const b of link) b.querySelector("input").addEventListener("change", check);
        const group = (title, hint, items, extra) => [
          el("h3", { style: "margin:14px 0 2px;display:flex;justify-content:space-between;font-size:0.95rem" }, title, extra || ""),
          el("small", { className: "mute", style: "display:block;margin-bottom:6px" }, hint),
          ...(items.length ? items : [el("small", { className: "mute", style: "display:block" }, "– noch keins –")]),
        ];
        // "+ Gerät hinzufügen": type selection, grouped like the lists
        const sel = el("select", { style: "flex:1" });
        for (const [label, ble] of [["Mithören", 1], ["Verbinden", 2]]) {
          const g = el("optgroup", { label });
          for (const t of types.filter((t) => (t.ble === 2) === (ble === 2))) g.append(el("option", { value: t.type, textContent: t.name }));
          if (g.children.length) sel.append(g);
        }
        const add = el(
          "div",
          { className: "f row", style: "margin-top:14px;align-items:center" },
          sel,
          el("button", {
            className: "b s",
            textContent: "+ Gerät hinzufügen",
            on: {
              click: () => {
                const o = sel.selectedOptions[0];
                if (!o || o.disabled) return toast("Dieses Gerät passt gerade nicht dazu (Grenze erreicht)", true);
                save({ add: o.value }, "Hinzugefügt");
              },
            },
          }),
        );
        check();
        // Pending changes: one restart applies all of them
        const restartBox = CFG.restart_needed
          ? el(
              "div",
              { className: "f", style: "margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(229,162,59,.12)" },
              el(
                "small",
                { style: "display:block;margin-bottom:8px;color:var(--warning)" },
                "Änderungen sind gespeichert und wirken nach dem Neustart.",
              ),
              restartButton(),
            )
          : null;
        $("#main").append(
          el(
            "div",
            { className: "card" },
            el("h2", {}, "Geräte"),
            restartBox,
            ...group("Mithören", "Sensoren, die nur senden (Thermometer, Gas, eigener BLE-Sensor). Beliebig viele.", listen),
            ...group(
              "Verbinden",
              `Geräte mit fester Bluetooth-Verbindung (z. B. Batterien, Dachhaube, Pumpe, Kühlschrank). Höchstens ${max} gleichzeitig – für mehr einen zweiten Node mit eigenem Topic nehmen (z. B. camper/ble2).`,
              link,
              count,
            ),
            add,
            el(
              "small",
              { className: "mute", style: "display:block;margin-top:8px" },
              `Insgesamt höchstens ${maxDev} Geräte. Ausgeschaltete Geräte behalten ihre Einstellungen, laufen aber nicht und fehlen in Home Assistant. Änderungen werden sofort gespeichert und wirken nach dem Neustart – mehrere Änderungen brauchen nur einen Neustart.`,
            ),
            boxes.length
              ? el("button", {
                  className: "b",
                  textContent: "An/Aus speichern",
                  on: {
                    click: () => {
                      const enabled = {};
                      for (const b of boxes) {
                        const i = b.querySelector("input");
                        if (!i.disabled || i.checked) enabled[i.dataset.id] = i.checked;
                      }
                      for (const p of CFG.plugins) if (p.removed) delete enabled[p.id];
                      save({ enabled }, "Gespeichert");
                    },
                  },
                })
              : null,
          ),
        );
      }
      // ---------------- Debug ----------------
      let dbgTimer = null,
        dbgId = null;
      function renderDebug() {
        const L = LIVE || {};
        const two = (n) => String(n).padStart(2, "0");
        const stamp = () => {
          const d = new Date();
          return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + "_" + two(d.getHours()) + "-" + two(d.getMinutes());
        };
        const save = (name, text) => {
          const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: name });
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        };
        const fetchLog = async (id) => {
          const r = await fetch("/api/log?id=" + encodeURIComponent(id), { cache: "no-store" });
          if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
          return r.text();
        };
        const plugins = CFG.plugins.filter((p) => !p.removed && !p.pending);
        // Node
        const node = el("table");
        const fillNode = () => {
          const l = LIVE || {};
          node.replaceChildren(
            ...[
              ["Firmware", CFG.version],
              ["Laufzeit", l.uptime != null ? Math.floor(l.uptime / 3600) + " h " + Math.floor((l.uptime % 3600) / 60) + " min" : "–"],
              ["Freier Speicher", l.heap != null ? Math.round(l.heap / 1024) + " kB" : "–"],
              ["Speicher minimal / größter Block", l.heap_min != null ? Math.round(l.heap_min / 1024) + " kB / " + Math.round(l.heap_block / 1024) + " kB" : "–"],
              ["BLE-Advertisements", l.ble ? l.ble.adv : "–"],
              ["BLE-Suche", l.ble ? (l.ble.scanning ? "läuft" : "aus") : "–"],
              ["WLAN-Signal", l.rssi ? l.rssi + " dBm" : "–"],
              ["MQTT", l.mqtt ? "verbunden" : "getrennt"],
            ].map((r) => el("tr", {}, el("td", {}, r[0]), el("td", {}, String(r[1])))),
          );
        };
        fillNode();
        // Devices: state as the live data reports it
        const devs = el("table");
        const fillDevs = () => {
          const lp = (LIVE && LIVE.plugins) || [];
          devs.replaceChildren(
            ...plugins.map((p) => {
              const x = lp.find((y) => y.id == p.id) || {};
              const st = !p.cfg.enabled ? "aus" : x.state || "–";
              return el("tr", {}, el("td", {}, (p.cfg.name || p.id) + " (" + p.type + ")"), el("td", { style: "color:var(--" + (x.ok ? "success" : "warning") + ")" }, st));
            }),
          );
        };
        fillDevs();
        // Log of one device
        if (!plugins.some((p) => p.id == dbgId)) dbgId = plugins.length ? plugins[0].id : null;
        const sel = el("select", {}, ...plugins.map((p) => el("option", { value: p.id, textContent: (p.cfg.name || p.id) + " (" + p.type + ")", selected: p.id == dbgId })));
        const pre = el("pre", { style: "max-height:50vh;overflow:auto;font-size:.72rem;line-height:1.35;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;background:var(--bg);border:1px solid var(--cm-line2);border-radius:8px;padding:8px" }, "Lade …");
        const auto = el("input", { type: "checkbox", checked: true });
        const show = async (scroll) => {
          if (!dbgId) { pre.textContent = "Keine Geräte."; return; }
          try {
            const t = await fetchLog(dbgId);
            const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
            pre.textContent = t;
            if (scroll || atEnd) pre.scrollTop = pre.scrollHeight;
          } catch (e) {
            pre.textContent = e.message;
          }
        };
        sel.addEventListener("change", () => { dbgId = sel.value; show(true); });
        const one = async () => {
          try {
            const p = plugins.find((x) => x.id == dbgId);
            const live = LIVE && LIVE.plugins ? LIVE.plugins.find((x) => x.id == dbgId) : null;
            save(CFG.device + "_" + dbgId + "_" + stamp() + ".log",
                 "# Download " + new Date().toLocaleString("de-DE") + "\n# Live " + JSON.stringify(live || {}) + "\n" + (await fetchLog(p.id)));
          } catch (e) { toast(e.message, true); }
        };
        const all = async () => {
          try {
            let text = "# " + CFG.device + " " + CFG.version + " – alle Geräte-Logs\n# Download " + new Date().toLocaleString("de-DE") +
              "\n# Node " + JSON.stringify({ uptime: (LIVE || {}).uptime, heap: (LIVE || {}).heap, heap_min: (LIVE || {}).heap_min, ble: (LIVE || {}).ble }) + "\n";
            for (const p of plugins) {
              const live = LIVE && LIVE.plugins ? LIVE.plugins.find((x) => x.id == p.id) : null;
              text += "\n\n######## " + (p.cfg.name || p.id) + " (" + p.type + ")\n# Live " + JSON.stringify(live || {}) + "\n";
              try { text += await fetchLog(p.id); } catch (e) { text += "(" + e.message + ")\n"; }
            }
            save(CFG.device + "_alle_" + stamp() + ".log", text);
          } catch (e) { toast(e.message, true); }
        };
        const clear = async () => {
          try {
            const r = await fetch("/api/log/clear?id=" + encodeURIComponent(dbgId), { method: "POST" });
            if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
            toast("Log geleert");
            show(true);
          } catch (e) { toast(e.message, true); }
        };
        $("#main").append(
          el("div", { className: "card" }, el("h2", {}, "Node"), node),
          el("div", { className: "card" }, el("h2", {}, "Geräte"), devs),
          el(
            "div",
            { className: "card" },
            el("h2", {}, "Log"),
            sel,
            pre,
            el("label", { style: "display:flex;gap:8px;align-items:center;margin-top:8px" }, auto, "Automatisch aktualisieren (alle 3 s)"),
            el("small", { className: "mute", style: "display:block;margin-top:6px" },
              "Verbindung, Kopplung, Bluetooth-Dienste und empfangene Daten je Gerät. Wird bei einem Neustart gelöscht."),
            el(
              "div",
              { style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap" },
              el("button", { className: "b", textContent: "Aktualisieren", on: { click: () => show(true) } }),
              el("button", { className: "b", textContent: "Herunterladen", on: { click: one } }),
              el("button", { className: "b", textContent: "Alle herunterladen", on: { click: all } }),
              el("button", { className: "b s", textContent: "Leeren", on: { click: clear } }),
            ),
          ),
        );
        show(true);
        clearInterval(dbgTimer);
        dbgTimer = setInterval(() => {
          if (tab != "dbg") { clearInterval(dbgTimer); dbgTimer = null; return; }
          if (document.hidden) return;
          fillNode();
          fillDevs();
          if (auto.checked) show(false);
        }, 3000);
      }

      function chips() {
        if (!LIVE) return;
        const s = (id, ok, title) => {
          const e = $(id);
          e.firstChild.className = "status-dot" + (ok ? " active" : " bad");
          e.title = title;
        };
        s("#cWifi", LIVE.rssi != 0, LIVE.rssi ? "WLAN " + LIVE.rssi + " dBm" : String(LIVE.wifi || ""));
        s("#cMqtt", LIVE.mqtt, LIVE.mqtt ? "MQTT verbunden" : "MQTT getrennt");
        const b = $("#cBle");
        if (LIVE.ble) {
          b.classList.remove("hide");
          b.firstChild.className = "status-dot" + (LIVE.ble.scanning ? " active" : "");
        } else b.classList.add("hide");
      }
      let oomShown = false;
      // WebSocket with the login: Safari does not send the page login along with the WebSocket, so the
// page fetches a token first (/api/wstoken) and passes it as ?t= (wsauth.h on the device)
function wsOpen(cb) {
    fetch('/api/wstoken', {cache: 'no-store'}).then((r) => r.ok ? r.json() : {}).catch(() => ({})).then((j) =>
        cb(new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws' + (j && j.t ? '?t=' + encodeURIComponent(j.t) : ''))));
}
function connect() {
    wsOpen((s) => {
        ws = s;
        ws.onmessage = (e) => {
          const d = JSON.parse(e.data);
          if (d.oom) {
            // Device out of memory: keep the last values, tell once
            if (!oomShown)
              toast("Zu wenig Speicher auf dem Gerät (frei " + Math.round(d.heap / 1024) + " kB) – ein Gerät abschalten", true);
            oomShown = true;
            return;
          }
          LIVE = d;
          chips();
          if (tab == "live") updateLive();
        };
        ws.onclose = () => setTimeout(connect, 3000);
    });
}
      async function load() {
        let c;
        // One more try after a short pause: the node may be busy (saving, connecting)
        for (let i = 0; ; i++) {
          try {
            c = await api("/api/config");
            if (!Array.isArray(c.plugins)) throw new Error("Einstellungen unvollständig empfangen – bitte neu laden");
            break;
          } catch (e) {
            if (i >= 1) throw e;
            await new Promise((r) => setTimeout(r, 1500));
          }
        }
        CFG = c;
        $("#title span").textContent = CFG.device;
        document.title = CFG.device;
        render();
      }
      load()

  async function restoreDisplay(b, net, log) {

    if (b.rules && b.rules.rules) { await post('/api/rules', b.rules); log('Automationen übernommen'); }

    if (n.includes('merged')) return {ok: false, msg: merged};
    const u = new Uint8Array(await file.arrayBuffer());
    if (u.length < 64 || u[0] !== 0xE9) return {ok: false, msg: 'Keine ESP-Firmware'};
    const esp32 = !FWI || FWI.chip_id >= 0;   // ESP8266 images have no chip id and no .merged.bin
    if (esp32 && u.length > 0x8001 && u[0x8000] === 0xAA && u[0x8001] === 0x50) return {ok: false, msg: merged};
    const chip = u[12] | (u[13] << 8);
    if (FWI && esp32 && chip !== FWI.chip_id) return {ok: false, msg: `Firmware für ${FW_CHIPS[chip] || 'einen unbekannten Chip'}, dieses Gerät ist ein ${FW_CHIPS[FWI.chip_id] || FWI.chip}${hwHint()}`};
    if (FWI && FWI.max && u.length > FWI.max) return {ok: false, msg: `Datei zu groß (${kb}, Platz ${Math.round(FWI.max / 1024)} kB)`};
    const m = new TextDecoder('latin1').decode(u).match(/CAMPER-FW:([A-Za-z0-9_.-]{1,24}):([A-Za-z0-9_.-]{1,24}):([A-Za-z0-9_.-]{1,24});/);
    if (!m) return {ok: false, force: true, msg: 'Keine Gerätekennung in der Datei: fremde Firmware oder eine Version vor der Kennung. Nur hochladen, wenn sicher ist, dass sie für dieses Gerät ist.'};
    if (FWI && m[1] !== FWI.dev) return {ok: false, msg: `Firmware für „${m[1]}“, dieses Gerät ist „${FWI.dev}“`};
    if (FWI && m[3] !== FWI.chip) return {ok: false, msg: `Firmware für ${m[3]}, dieses Gerät ist ein ${FWI.chip}${hwHint()}`};
    const c = FWI ? verCmp(m[2], FWI.ver) : 1;
    return {ok: true, kind: 'fw', warn: c <= 0, msg: `Firmware ${m[1]} v${m[2]} (${kb}) – ` +
      (c > 0 ? 'neuer als die installierte' : c === 0 ? 'gleiche Version wie installiert' : 'ÄLTER als die installierte (Downgrade)')};
  }

  function showInfo() {
    const cur = $('fwu-cur');
    if (cur && FWI) cur.innerHTML = `Installiert: <b>${esc(FWI.dev)} v${esc(FWI.ver)}</b> · ${FW_CHIPS[FWI.chip_id] || esc(FWI.chip)}` +
      (FWI.max ? ` · Platz ${Math.round(FWI.max / 1024)} kB` : '');
    const hint = $('vnc-uhint');
    if (hint && FWI) {
      const dev = esc(FWI.dev || 'gerät'), hw = esc(FWI.hw || '<board>');
      hint.innerHTML = `Firmware: die <code>${dev}-node-${hw}-v….bin</code> aus dem Release oder aus der Arduino IDE ` +
        `(Sketch → Kompilierte Binärdatei exportieren → <code>….ino.bin</code>, <b>nicht</b> die <code>.merged.bin</code>), danach Neustart.` +
        (cfg.web ? `<br>Web-Oberfläche: die <code>${dev}-node-web-v….html.gz</code> aus dem Release oder <code>data/index.html.gz</code>, ohne Neustart.` : '') +
        (cfg.fs ? ' Ein LittleFS-Abbild (Dateiname mit „littlefs“) wird ebenfalls erkannt.' : '') +

        const bad = /abgelehnt|fehlgeschlagen|nicht gespeichert|zurück auf|Absturz|Watchdog|Spannungseinbruch/.test(e.m);
        return `<div class="fwu-ev${bad ? ' bad' : ''}"><span>${esc(when)}</span>${esc(e.m)}</div>`;

  async function load() {
    try {
      const r = await fetch('/api/system', {cache: 'no-store'});
      if (!r.ok) return;
      const d = await r.json();
      FWI = d.fw || null;
      LOG = d.log || [];
      UP = d.up || 0;
      cfg = Object.assign({}, DEF, FWI && DEVCFG[FWI.dev] || {});
      const inp = $('vnc-ufile');
      if (inp) inp.accept = cfg.web ? '.bin,.gz' : '.bin';
      showInfo();
      // fallback MQTT broker in use (mqttfb.h)
      const mf = $('vnc-mqfb');
      if (mf) {
        const m = d.mqttfb;
        mf.style.display = m && m.on ? '' : 'none';
        if (m && m.on) mf.innerHTML = `<span class="warn">MQTT über Ersatz-Broker ${esc(m.fb)}</span> · seit ${esc(ago(m.since || 0))}`;
      }
      CLK = d.clock ? Object.assign({at: Date.now()}, d.clock) : null;
      showClock();
      // No valid time on the device (no internet, no NTP at the router): take the browser's once
      if (CLK && !CLK.ok && !clkAuto) {
        clkAuto = true;
        setClock(Date.now(), false, 'Uhrzeit automatisch vom Browser übernommen (das Gerät hatte keine).');
      }
    } catch (e) {}
  }

  // ---- Clock card ----
  const SRC = {ntp: 'über das Internet (NTP)', browser: 'vom Browser übernommen', manual: 'von Hand gesetzt'};
  const two = (n) => String(n).padStart(2, '0');
  const fmtTime = (d) => ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()] + ' ' + two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' +
    d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  function showClock() {
    const c = $('vn-clock');
    if (!c) return;
    c.style.display = CLK ? '' : 'none';
    if (!CLK) return;
    const cur = $('vnc-ccur');
    if (!CLK.ok) {
      cur.innerHTML = '<span class="warn">Keine Uhrzeit gesetzt</span>';
    } else {
      const dev = new Date((CLK.t * 1000) + (Date.now() - CLK.at));
      const off = Math.round((dev.getTime() - Date.now()) / 60000);
      cur.innerHTML = 'Gerät: <b>' + fmtTime(dev) + '</b> · ' + esc(SRC[CLK.src] || 'Quelle unbekannt') +
        (Math.abs(off) >= 2 ? ' · <span class="warn">weicht ' + Math.abs(off) + ' min vom Browser ab</span>' : '');
    }
    const inp = $('vnc-cin');
    if (inp && !inp.value) {
      const n = new Date();
      inp.value = n.getFullYear() + '-' + two(n.getMonth() + 1) + '-' + two(n.getDate()) + 'T' + two(n.getHours()) + ':' + two(n.getMinutes());

  async function setClock(ms, manual, okText) {

      let j = {};
      try { j = await r.json(); } catch (e) {}
      if (!r.ok || j.ok === false) throw new Error(j.error || j.msg || ('HTTP ' + r.status));
      if (out) out.textContent = okText;
      load();
    } catch (e) { if (out) out.textContent = 'Nicht gesetzt: ' + e.message; }
  }

  function setChk(text, cls) {
    const chk = $('fwu-chk');
    if (!chk) return;
    chk.textContent = text;
    chk.className = 'vnc-chk ' + (cls || '');
  }

  async function chosen() {
    const f = $('vnc-ufile').files[0], btn = $('fwu-btn'), lab = $('vnc-ulabel');
    pick = null;
    $('vnc-uforce-row').style.display = 'none';
    $('vnc-uforce').checked = false;
    lab.classList.toggle('has', !!f);
    lab.querySelector('.nm').textContent = f ? f.name : (cfg.web ? '.bin oder .html.gz wählen …' : '.bin wählen …');
    if (!f) { setChk(''); btn.disabled = true; return; }
    setChk('Prüfe …');
    const r = await inspect(f);
    pick = r;
    setChk((r.ok ? (r.warn ? '⚠ ' : '✓ ') : '✕ ') + r.msg, r.ok ? (r.warn ? 'warn' : 'ok') : 'bad');
    if (r.force) $('vnc-uforce-row').style.display = '';
    btn.disabled = !r.ok;
  }

  function upload() {
    const f = $('vnc-ufile').files[0], btn = $('fwu-btn'), bar = $('vnc-ubar');
    if (!f || !pick) return setChk('Erst eine Datei wählen', 'bad');
    if (pick.warn && pick.kind === 'fw' && !confirm(pick.msg + '\nTrotzdem installieren?')) return;
    const force = !pick.ok && pick.force && $('vnc-uforce').checked;
    const fd = new FormData();
    fd.append(cfg.field, f);
    const x = new XMLHttpRequest();
    bar.style.display = '';
    bar.firstChild.style.width = '0%';
    btn.disabled = true;
    x.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      bar.firstChild.style.width = p + '%';
      setChk(p < 100 ? `Übertrage … ${p} %` : 'Wird geschrieben …');
    };
    x.onload = () => {
      let j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      const text = (j && j.msg) || x.responseText || ('Fehler HTTP ' + x.status);
      const ok = x.status === 200 && (j ? j.ok !== false : /^OK/i.test(x.responseText) || x.responseText === '');
      if (ok && /^OK web/.test(x.responseText)) { setChk('✓ Web-Oberfläche ersetzt – Seite lädt neu …', 'ok'); setTimeout(() => location.reload(), 1500); return; }
      if (ok) { setChk('✓ Update ok – das Gerät startet neu, die Seite lädt gleich neu …', 'ok'); setTimeout(() => location.reload(), 15000); return; }
      bar.style.display = 'none';
      setChk('✕ ' + text, 'bad');
      btn.disabled = false;
      load();
    };
    x.onerror = () => { bar.style.display = 'none'; setChk('✕ Verbindung abgebrochen', 'bad'); btn.disabled = false; load(); };
    x.open('POST', cfg.upd + (force ? '?force=1' : ''));
    x.send(fd);
  }

  async function devAction(url, question, msg) {
    if (!confirm(question)) return;
    const out = $('vnc-dmsg');
    try {
      await fetch(url, {method: 'POST'});
      out.textContent = msg;
      setTimeout(() => location.reload(), 10000);
    } catch (e) { out.textContent = 'Keine Verbindung zum Gerät'; }
  }

    return c;

  function build(box) {

      document.head.appendChild(st);
    }
    const upd = card('Firmware- &amp; Web-Update');
    upd.id = 'vn-update';
    upd.insertAdjacentHTML('beforeend',
      '<div class="vnc-cur" id="fwu-cur">Installiert: …</div>' +
      '<div class="vnc-hint" id="vnc-uhint">Die Datei wird vor dem Hochladen geprüft.</div>' +
      '<label class="vnc-file" id="vnc-ulabel">' + ICON.file + '<span class="nm">Datei wählen …</span>' +
      '<span class="pick">Durchsuchen</span><input type="file" id="vnc-ufile" accept=".bin,.gz"></label>' +
      '<div class="vnc-chk" id="fwu-chk"></div>' +
      '<label class="vnc-opt" id="vnc-uforce-row" style="display:none"><input type="checkbox" id="vnc-uforce"> Ohne Kennung hochladen</label>' +
      '<div class="vnc-bar" id="vnc-ubar" style="display:none"><i></i></div>' +
      '<div class="vnc-row"><button type="button" class="vnc-b p" id="fwu-btn" disabled>' + ICON.up + 'Hochladen</button></div>');
    box.appendChild(upd);

    if (box.dataset.log !== '0') {
      const log = card('Ereignisse');
      log.insertAdjacentHTML('beforeend', '<div class="vnc-cur" id="vnc-mqfb" style="display:none"></div><div class="fwu-log">Lade …</div>' +
        '<div class="vnc-hint" style="margin:8px 0 0">Bleibt bei Neustart, Absturz und Update erhalten, nicht bei Stromausfall.</div>');
      box.appendChild(log);
    }

    const clk = card('Uhrzeit');
    clk.id = 'vn-clock';
    clk.style.display = 'none';
    clk.insertAdjacentHTML('beforeend',
      '<div class="vnc-cur" id="vnc-ccur">…</div>' +
      '<div class="vnc-hint">Ohne Internet übernimmt diese Seite die Uhrzeit automatisch vom Handy bzw. Rechner, sobald das Gerät keine hat. ' +
      'Die Zeit bleibt bei einem Neustart erhalten, nicht bei Stromausfall; ein späterer Abgleich über das Internet ersetzt sie.</div>' +
      '<div class="vnc-row" style="margin-bottom:10px"><button type="button" class="vnc-b p" id="vnc-cnow">Uhrzeit vom Handy übernehmen</button></div>' +
      '<div class="vnc-row"><input type="datetime-local" class="vnc-in" id="vnc-cin">' +
      '<button type="button" class="vnc-b" id="vnc-cset" style="flex:0 1 auto">Von Hand setzen</button></div>' +
      '<div class="vnc-msg" id="vnc-cmsg"></div>');
    box.appendChild(clk);

    const dev = card('Gerät');
    dev.insertAdjacentHTML('beforeend',
      '<div class="vnc-row"><button type="button" class="vnc-b" id="vnc-restart">' + ICON.restart + 'Neustart</button>' +
      '<button type="button" class="vnc-b d" id="vnc-factory" style="display:none">Werkseinstellungen</button></div>' +
      '<div class="vnc-msg" id="vnc-dmsg"></div>');
    box.appendChild(dev);

    $('vnc-ufile').addEventListener('change', chosen);
    $('vnc-uforce').addEventListener('change', () => {
      $('fwu-btn').disabled = !(pick && (pick.ok || (pick.force && $('vnc-uforce').checked)));
    });
    $('fwu-btn').addEventListener('click', upload);
    $('vnc-cnow').addEventListener('click', () => setClock(Date.now(), false, 'Uhrzeit vom Browser übernommen.'));

      'Zurückgesetzt – das Gerät startet neu und öffnet sein Setup-WLAN.'));

  function place() {
    const box = $('vn-system');
