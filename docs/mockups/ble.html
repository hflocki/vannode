<script>
// ble-node: Bluetooth devices as plugins (here: an RV Tech roof hatch and an own BLE sensor)
const M = {
  id: 'ble',
  config: {
    version: '2.0.0', device: 'tool-node', reset_reason: 'Neustart (Software)', ha_node: 'camper_tool',
    core: {wifi_ssid: 'Camper-WLAN', wifi_pass_set: true, ap_ssid: 'BLE-Node-A1B2C3', wifi_tx_power: 70, ap_always: false,
           mqtt_server: '192.168.1.1', mqtt_port: 1883, mqtt_user: '', mqtt_pass_set: false, mqtt_prefix: 'camper/tool',
           web_user: '', web_pass_set: false, node_name: 'tool-node'},
    plugins: [{id: 'rvtech', type: 'rvtech', type_name: 'RV Tech Dachhaube', ble: 2, running: true,
               cfg: {enabled: true, name: 'Dachhaube', mac: 'F0:F8:F2:00:00:01', pin: ''}},
              // own BLE sensor: a Xiaomi thermometer with custom firmware (service data 181A)
              {id: 'blesensor', type: 'blesensor', running: true, type_name: 'Eigener BLE-Sensor', ble: 1,
               cfg: {enabled: true, name: 'Thermometer Bad', mac: 'A4:C1:38:12:34:56', source: 1, company: '', uuid: '181A',
                     v1_name: 'Temperatur', v1_pos: 6, v1_len: 1, v1_signed: true, v1_big: false, v1_factor: 0.01, v1_add: 0, v1_dec: 1, v1_unit: '°C', v1_kind: 1,
                     v2_name: 'Luftfeuchte', v2_pos: 8, v2_len: 1, v2_signed: false, v2_big: false, v2_factor: 0.01, v2_add: 0, v2_dec: 0, v2_unit: '%', v2_kind: 2,
                     v3_name: 'Batterie', v3_pos: 12, v3_len: 0, v3_signed: false, v3_big: false, v3_factor: 1, v3_add: 0, v3_dec: 0, v3_unit: '%', v3_kind: 3}}],
    // field descriptions once per type (as the firmware sends them since 1.5.2)
    schemas: {
      rvtech: [{k: 'mac', l: 'Hauben-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen'},
                        {k: 'pin', l: 'PIN', t: 'text', max: 7, h: 'Nur Ziffern (1-6, auch 000000). Leer lassen, wenn keine nötig ist.'}],
      daly: [{k: 'mac', l: 'Batterie-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen'},
             {k: 'interval', l: 'Abfrageintervall', t: 'int', min: 5, max: 300, u: 's', h: 'Wie oft die Werte gelesen werden'}],
      ective: [{k: 'mac', l: 'Batterie-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen'},
               {k: 'interval', l: 'Abfrageintervall', t: 'int', min: 5, max: 300, u: 's', h: 'Wie oft die Werte gelesen werden'}],
      bm2: [{k: 'mac', l: 'BM2-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen (Name "Battery Monitor" / "BM2")'}],
      govee: [{k: 'mac', l: 'Sensor-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen (Name GVH5…)'},
              {k: 'temp_offset', l: 'Korrektur Temperatur', t: 'float', min: -10, max: 10, step: 0.1, u: '°C', h: 'Wird zum Messwert addiert, z. B. -0,5'},
              {k: 'hum_offset', l: 'Korrektur Luftfeuchte', t: 'float', min: -20, max: 20, step: 0.5, u: '%'}],
      bthome: [{k: 'mac', l: 'Sensor-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen (passt: Dienst FCD2)'},
               {k: 'objs', l: 'Erkannte Werte', t: 'text', max: 24, h: 'Füllt sich beim Empfang von selbst. Leeren und speichern, um die Werte neu zu erkennen'}],
      blesensor: [{k: 'mac', l: 'Sensor-MAC', t: 'mac', h: 'Über "Suchen" aus der Liste wählen'},
                 {k: 'source', l: 'Datenquelle', t: 'select', o: 'Herstellerdaten|Service-Daten'},
                 {k: 'company', l: 'Hersteller-ID', t: 'text', max: 7, h: 'Nur Herstellerdaten: z. B. FFFF, leer = beliebig'},
                 {k: 'uuid', l: 'Service-UUID', t: 'text', max: 39, h: 'Nur Service-Daten: z. B. 181A, leer = die erste'},
                 ...[1, 2, 3].flatMap(n => [
                   {k: `v${n}_name`, l: `Wert ${n}: Name`, t: 'text', max: 23, h: 'Leer = Wert nicht benutzt'},
                   {k: `v${n}_pos`, l: `Wert ${n}: Stelle`, t: 'int', min: 0, max: 63, step: 1, h: 'Position im Paket, 0 = erstes Byte (siehe Rohdaten)'},
                   {k: `v${n}_len`, l: `Wert ${n}: Länge`, t: 'select', o: '1 Byte|2 Byte|4 Byte'},
                   {k: `v${n}_signed`, l: `Wert ${n}: mit Vorzeichen`, t: 'bool'},
                   {k: `v${n}_big`, l: `Wert ${n}: höchstes Byte zuerst`, t: 'bool'},
                   {k: `v${n}_factor`, l: `Wert ${n}: Faktor`, t: 'float', min: -1000000, max: 1000000, step: 0.000001},
                   {k: `v${n}_add`, l: `Wert ${n}: Offset`, t: 'float', min: -1000000, max: 1000000, step: 0.000001},
                   {k: `v${n}_dec`, l: `Wert ${n}: Nachkommastellen`, t: 'int', min: 0, max: 4, step: 1},
                   {k: `v${n}_unit`, l: `Wert ${n}: Einheit`, t: 'text', max: 9},
                   {k: `v${n}_kind`, l: `Wert ${n}: Art`, t: 'select', o: 'Allgemein|Temperatur|Luftfeuchte|Batterie|Spannung|Strom|Leistung|Druck'}])]
    },
    types: [{type: 'rvtech', name: 'Dachhaube RV Tech', ble: 2}, {type: 'daly', name: 'Batterie: Daly BMS', ble: 2}, {type: 'ective', name: 'Batterie: Ective BM X', ble: 2}, {type: 'bm2', name: 'Batterie: BM2 Batteriewächter', ble: 2}, {type: 'pump', name: 'Wasserpumpe CaraWater', ble: 2},
            {type: 'fridge', name: 'Kühlschrank WCS', ble: 2}, {type: 'dimes', name: 'Gas: DIMES / SRG WAVE', ble: 1},
            {type: 'mopeka', name: 'Gas: Mopeka Pro', ble: 1}, {type: 'mopeka_std', name: 'Gas: Mopeka Standard', ble: 1},
            {type: 'govee', name: 'Thermometer Govee', ble: 1}, {type: 'bthome', name: 'BTHome-Sensor (ATC/pvvx, Shelly BLU …)', ble: 1}, {type: 'blesensor', name: 'Eigener BLE-Sensor', ble: 1}],
    max_devices: 12,
    max_links: 3
  },
  pos: 0, target: -1, release: false,
  // device changes are saved at once and take effect with the restart (restart_needed)
  keep(plugins) {
    M.save({plugins, restart_needed: plugins.some(p => p.pending || p.removed || p.cfg.enabled !== p.running)});
  },
  route(path, method, body) {
    if (path === '/api/config' && method === 'POST') {
      const c = M.cfg;
      if (body.core) M.save({core: Object.assign({}, c.core, body.core, {wifi_pass: undefined, mqtt_pass: undefined, web_pass: undefined})});
      else if (body.plugin) {
        const p = c.plugins.find(x => x.id === body.plugin);
        if (p) { Object.assign(p.cfg, body.cfg); M.save({plugins: c.plugins}); }
      } else if (body.enabled) {
        c.plugins.forEach(p => { if (p.id in body.enabled && !p.removed) p.cfg.enabled = body.enabled[p.id]; });
        M.keep(c.plugins);
      } else if (body.remove) {
        // pending devices disappear right away, running ones after the restart
        const p = c.plugins.find(x => x.id === body.remove);
        M.keep(p && p.pending ? c.plugins.filter(x => x !== p) : c.plugins.map(x => x === p ? Object.assign({}, x, {removed: true}) : x));
      } else if (body.restore) {
        M.keep(c.plugins.map(x => x.id === body.restore ? Object.assign({}, x, {removed: undefined}) : x));
      } else if (body.add) {
        const t = c.types.find(x => x.type === body.add);
        let n = 1;
        while (c.plugins.some(p => p.id === (n === 1 ? t.type : t.type + n))) n++;
        const id = n === 1 ? t.type : t.type + n;
        if (!c.schemas[t.type]) M.save({schemas: Object.assign({}, c.schemas, {[t.type]: [{k: 'mac', l: 'MAC', t: 'mac'}]})});
        M.keep(c.plugins.concat([{id, type: t.type, type_name: t.name, ble: t.ble, running: false, pending: true,
                                  cfg: {enabled: true, name: t.name + (n > 1 ? ' ' + n : ''), mac: ''}}]));
      }
      return {status: 'ok'};
    }
    if (path === '/api/restart' && method === 'POST') {
      // the restart applies all saved device changes
      const plugins = M.cfg.plugins.filter(p => !p.removed)
        .map(p => Object.assign({}, p, {pending: undefined, running: p.cfg.enabled}));
      M.keep(plugins);
      return {status: 'restarting'};
    }
    if (path === '/api/cmd') {
      const P = {auf: 100, zu: 0, regen: 12, lueften: 102};
      const k = body.k === 'preset' ? body.v : body.k;
      if (k === 'release') M.release = body.v === 'true' || body.v === 'ON' || body.v === '1';
      else if (k in P) M.target = P[k];
      else if (k === 'cover_position') M.target = +body.v;
      return {status: 'ok'};
    }
    if (path === '/api/log') {
      return '# Beispiel-Log (Mockup)\n0:00:05.120 State: Verbinde\n0:00:05.880 Connected, MTU 247, 1 subscription(s)\n';
    }
    if (path === '/api/log/clear') return { ok: true };
    if (path === '/api/scan') {
      return {active: true, devices: [
        {mac: 'F0:F8:F2:00:00:01', name: 'RVT-Skylight', rssi: -71, mfg: '', uuid: 'ffe0', age: 2, fits: ['rvtech']},
        {mac: 'C8:47:8C:00:00:03', name: 'DL-C8478C000003', rssi: -68, mfg: '0102', uuid: '0xfff0', age: 1, fits: ['daly']},
        {mac: 'A4:C1:38:AB:CD:EF', name: 'ATC_ABCDEF', rssi: -76, mfg: '', uuid: '0xfcd2', age: 3, fits: ['bthome']},
        {mac: 'A4:C1:38:00:00:02', name: 'GVH5075_1A2B', rssi: -83, mfg: '88EC', uuid: '', age: 5, fits: ['govee']}]};
    }
  },
  state() {
    // the hatch moves 5 % per update towards the target
    if (M.target >= 0) {
      const goal = Math.min(M.target, 100);
      if (M.pos < goal) M.pos = Math.min(goal, M.pos + 5);
      else if (M.pos > goal) M.pos = Math.max(goal, M.pos - 5);
      if (M.pos === goal) { if (M.target === 102) M.pos = 102; M.target = -1; }
    }
    const shown = Math.min(M.pos, 100);
    const label = M.pos === 102 ? 'Lüften' : M.target >= 0 ? (M.target > M.pos ? 'Öffnet...' : 'Schließt...') : M.pos === 0 ? 'Geschlossen' : 'Offen';
    // live data: only what runs in this boot (pending devices start with the restart)
    const runs = p => p.running && !p.removed;
    const on = runs(M.cfg.plugins[0]);
    const others = M.cfg.plugins.slice(1).filter(p => !p.pending && !p.removed).map(p => {
      const o = {id: p.id, name: p.cfg.name, type: p.type, enabled: runs(p)};
      if (!o.enabled) return o;
      if (p.type === 'daly' && p.cfg.mac) return Object.assign(o, {state: 'OK', ok: true, gauge: {v: 78, unit: '%', label: 'Ladestand', max: 100},
        rows: [['Spannung', 13.31, 'V'], ['Strom', -4.2, 'A'], ['Leistung', -56, 'W'], ['Restkapazität', 78, 'Ah'], ['Energie', 1038, 'Wh'],
               ['Restlaufzeit', 18.6, 'h'], ['Temperatur', 14.5, '°C'], ['Zellen', '4 × 3.326 … 3.331 V', ''], ['Zelldifferenz', 5, 'mV'], ['Zyklen', 41, ''], ['Alter', 3, 's'], ['Bluetooth', -68, 'dBm']],
        ctrl: [{t: 'switch', k: 'release', l: 'Bluetooth für App freigeben', v: false}]});
      if (p.type === 'bthome' && p.cfg.mac) return Object.assign(o, {state: 'OK', ok: true,
        rows: [['Batterie', 87, '%'], ['Temperatur', 19.8, '°C'], ['Luftfeuchte', 54.2, '%'], ['Spannung', 2.91, 'V'], ['Bluetooth', -76, 'dBm'], ['Alter', 6, 's']],
        raw: '40 00 A5 01 57 02 BC 07 03 2C 15 0C 5E 0B'});
      if (p.type === 'govee' && p.cfg.mac) return Object.assign(o, {state: 'OK', ok: true,
        rows: [['Temperatur', 4.3, '°C'], ['Luftfeuchte', 71, '%'], ['Batterie', 100, '%'], ['Modell', 'H5072/H5075', ''], ['Bluetooth', -83, 'dBm'], ['Alter', 12, 's']]});
      if (p.type !== 'blesensor') return Object.assign(o, {state: 'Warte auf Daten', ok: false, rows: []});
      const t = 21.4 + Math.sin((Date.now() - M.t0) / 60000) * 0.3;
      return Object.assign(o, {state: 'OK', ok: true,
        rows: [['Temperatur', Math.round(t * 10) / 10, '°C'], ['Luftfeuchte', 58, '%'], ['Batterie', 87, '%'], ['Bluetooth', -77, 'dBm'], ['Alter', 4, 's']],
        raw: '0: 56 34 12 38  4: C1 A4 5C 08  8: A8 16 1E 0B  12: 57 C2 0F'});
    });
    const plug = {id: 'rvtech', name: M.cfg.plugins[0].cfg.name, type: 'rvtech', enabled: on};
    if (on) Object.assign(plug, {
      state: M.release ? 'Für App freigegeben' : 'Verbunden', ok: !M.release,
      gauge: {v: shown, unit: '%', label},
      rows: [['Gemeldet', M.pos, ''], ['Ziel', M.target >= 0 ? M.target : null, ''], ['Bluetooth', -71, 'dBm']],
      ctrl: [{t: 'buttons', k: 'preset', b: [['auf', 'Auf'], ['zu', 'Zu'], ['regen', 'Regen'], ['lueften', 'Lüften']]},
             {t: 'slider', k: 'cover_position', l: 'Position', min: 0, max: 100, v: shown},
             {t: 'switch', k: 'release', l: 'Bluetooth für App freigeben', v: M.release}]
    });
    return {rssi: -58, uptime: M.up(), heap: 98000, wifi_drops: 0, wifi_reason: '', wifi: 'Verbunden', mqtt: true,
            ble: {adv: 1200 + Math.floor((Date.now() - M.t0) / 100), scanning: true}, plugins: [plug, ...others]};
  }
};

// Mockup runtime: replaces the device API (fetch, WebSocket, upload) with a simulation.
// The device script before this one defines M = {config, state(), route(), wsCmd(), wsOpen()}.
(function () {
  const KEY = 'mock:' + (M.id || location.pathname);
  // Settings survive the "restart" reload of the page (per browser tab only).
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
  M.cfg = Object.assign({}, M.config, saved);
  M.save = function (patch) {
    Object.assign(M.cfg, patch);
    Object.assign(saved, patch);
    try { sessionStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
  };
  M.t0 = Date.now();
  M.up = () => (M.uptime0 || 93780) + Math.floor((Date.now() - M.t0) / 1000);

  const json = (o, status) => Promise.resolve(new Response(typeof o === 'string' ? o : JSON.stringify(o),
    { status: status || 200, headers: { 'Content-Type': typeof o === 'string' ? 'text/plain' : 'application/json' } }));
  function bodyOf(opt) {
    const b = opt && opt.body;
    if (!b) return {};
    if (typeof b === 'string') {
      try { return JSON.parse(b); } catch (e) { return Object.fromEntries(new URLSearchParams(b)); }
    }
    if (b instanceof URLSearchParams || b instanceof FormData) return Object.fromEntries(b);
    return {};
  }
  window.fetch = function (url, opt) {
    opt = opt || {};
    const u = new URL(url, location.href);
    const method = (opt.method || 'GET').toUpperCase();
    const body = bodyOf(opt);
    const r = M.route ? M.route(u.pathname, method, body, u.searchParams) : undefined;
    if (r !== undefined) return json(r);
    // firmware info and event log (fwcheck / evlog), the same example for every device
    if (u.pathname === '/api/system' && method === 'GET') {
      const S3 = M.id === 'level' || M.id === 'display';
      return json({fw: {dev: M.id, ver: (M.cfg && M.cfg.version) || '1.7.0', chip: S3 ? 'esp32s3' : 'esp32c3', chip_id: S3 ? 9 : 5, hw: S3 ? 'esp32s3' : 'esp32c3', max: 1966080},
                   up: 5400, log: [
        {b: 0, t: 5380, m: 'MQTT verbunden'}, {b: 0, t: 5378, m: 'WLAN verbunden (192.168.8.31, -61 dBm)'},
        {b: 0, t: 3600, m: 'Update abgelehnt: das ist die .merged.bin (komplettes Flash-Abbild für USB) – bitte die .bin ohne „merged“ nehmen'},
        {b: 0, t: 3598, m: 'Firmware-Upload gestartet (1340 kB)'}, {b: 0, t: 3, m: 'MQTT verbunden'},
        {b: 0, t: 2, m: 'WLAN verbunden (192.168.8.31, -63 dBm)'}, {b: 0, t: 0, m: 'Start v' + ((M.cfg && M.cfg.version) || '1.7.0') + ', Grund: Neustart (Software)'},
        {b: 1, t: 812, m: 'Update auf v' + ((M.cfg && M.cfg.version) || '1.7.0') + ' ok (1187 kB), Neustart'}, {b: 1, t: 0, m: 'Start v1.6.0, Grund: Einschalten'}]});
    }
    if (u.pathname === '/api/config' && method === 'GET') return json(M.cfg);
    if (u.pathname === '/api/config' && method === 'POST') {
      const p = Object.assign({}, body);
      for (const k of Object.keys(p)) if (/pass|token/i.test(k)) delete p[k];  // never echo secrets
      M.save(p);
      return json({ ok: true });
    }
    return json({ ok: true });
  };

  // WebSocket: pushes M.state() every M.wsInterval ms, M.wsCmd() gets what the page sends
  class FakeWS {
    constructor() {
      this.readyState = 0;
      setTimeout(() => {
        this.readyState = 1;
        if (this.onopen) this.onopen({});
        if (M.wsOpen) M.wsOpen((o) => this._emit(o));
        this._tick();
      }, 120);
      this._timer = setInterval(() => this._tick(), M.wsInterval || 1000);
    }
    _emit(o) { if (this.onmessage) this.onmessage({ data: JSON.stringify(o) }); }
    _tick() { if (M.state) this._emit(M.state()); }
    send(d) {
      let o = d;
      try { o = JSON.parse(d); } catch (e) {}
      const reply = M.wsCmd ? M.wsCmd(o) : null;
      if (reply) this._emit(reply);
      setTimeout(() => this._tick(), 150);
    }
    close() { clearInterval(this._timer); this.readyState = 3; }
    addEventListener(ev, fn) { this['on' + ev] = fn; }
  }
  FakeWS.CONNECTING = 0; FakeWS.OPEN = 1; FakeWS.CLOSING = 2; FakeWS.CLOSED = 3;
  window.WebSocket = FakeWS;

  // File upload: simulated progress, answers like the firmware ("OK" or "OK web" for a .gz page)
  class FakeXHR {
    constructor() { this.upload = {}; this.status = 0; this.responseText = ''; }
    open(m, u) { this._u = u; }
    setRequestHeader() {}
    send(fd) {
      let name = '';
      try { for (const v of fd.values()) if (v && v.name) name = v.name; } catch (e) {}
      let p = 0;
      const iv = setInterval(() => {
        p += 25;
        if (this.upload.onprogress) this.upload.onprogress({ lengthComputable: true, loaded: p, total: 100 });
        if (p >= 100) {
          clearInterval(iv);
          this.status = 200;
          this.responseText = /\.gz$/i.test(name) ? 'OK web' : 'OK';
          if (this.onload) this.onload();
        }
      }, 250);
    }
  }
  window.XMLHttpRequest = FakeXHR;

  // Dialogs are blocked in some embedded viewers; the mockup always answers "yes"
  window.confirm = () => true;
  window.alert = (m) => console.log('[alert]', m);

  // Banner
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.textContent = 'Mockup mit Beispieldaten – keine Verbindung zu einem Gerät';
    b.style.cssText = 'position:sticky;top:0;z-index:9999;background:#d4a017;color:#000;text-align:center;font:600 12px system-ui;padding:4px';
    document.body.prepend(b);
    // body as a flex row (e.g. BLE node on wide screens): the bar would become a column,
    // so it is fixed on top and the body moves down by its height
    const cs = getComputedStyle(document.body);
    if (cs.display.includes('flex') && !cs.flexDirection.startsWith('column')) {
      b.style.position = 'fixed'; b.style.left = '0'; b.style.right = '0';
      document.body.style.paddingTop = ((parseFloat(cs.paddingTop) || 0) + b.offsetHeight) + 'px';
    }
  });
})();

</script>

    <meta charset="utf-8" />

    <title>VanNode BLE</title>
    <style>
      /* Same look as the other VanNode devices (battery, tanklevel, temp ...) */
      :root {
        --bg-primary: #0f1419;
        --bg-secondary: #1a2332;
        --bg-card: #1e2d3d;
        --bg-input: #0d1b2a;
        --accent: #4fc3f7;
        --warning: #ffb800;
        --danger: #ff4757;
        --success: #00d4aa;
        --warm: #ff9f43;
        --text-primary: #e8f0f8;
        --text-secondary: #8899aa;
        --text-muted: #556677;
        --border: #2a3a4a;
        --radius: 12px;
        /* names used by the firmware update block */
        --ok: var(--success);
        --warn: var(--warning);
        --bad: var(--danger);
        --mute: var(--text-secondary);
        --line: var(--border);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg-primary); color: var(--text-primary);
        min-height: 100vh; overflow-x: hidden;
      }
      header {
        background: var(--bg-secondary); padding: 16px 20px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
      }
      header h1 { font-size: 1.15rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
      .status-dots { display: flex; gap: 6px; align-items: center; font-size: 0.65rem; color: var(--text-muted); }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; margin-right: 4px; }
      .status-dot.active { background: var(--success); box-shadow: 0 0 8px rgba(0, 212, 170, 0.3); }
      .status-dot.bad { background: var(--danger); }
      /* Icon above the label: all tabs fit even on small phones */
      nav { display: flex; background: var(--bg-secondary); border-bottom: 1px solid var(--border); overflow-x: auto; }
      nav button {
        flex: 1 0 64px; min-width: 64px; max-width: 140px; padding: 8px 6px 7px; font: inherit; font-size: 0.68rem; font-weight: 500; line-height: 1.2;
        display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0;
        color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      nav button .ico { font-size: 1.05rem; line-height: 1; }
      nav button.on { color: var(--accent); border-bottom-color: var(--accent); background: rgba(79, 195, 247, 0.05); }
      main { padding: 16px; }
      @media (min-width: 600px) {
        body { display: flex; justify-content: center; }
        .app-wrap { width: 100%; max-width: 520px; }
      }
      .card {
        position: relative; background: var(--bg-card); border-radius: var(--radius); padding: 16px;
        margin-bottom: 12px; border: 1px solid var(--border); overflow: hidden; font-size: 0.85rem;
      }
      .card h2 {
        display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
        font-size: 0.75rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--text-secondary); margin-bottom: 12px;
      }
      .card h2 .mute { text-transform: none; letter-spacing: 0; font-size: 0.65rem; color: var(--text-muted); }
      /* Live: one card per plugin with a coloured bar on the left like the battery cards */
      .card.dev-card { padding: 14px 14px 12px 20px; }
      .card.dev-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--text-muted); }
      .card.dev-card.ok::before { background: var(--success); }
      .state { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: none; letter-spacing: 0;
        background: rgba(255, 184, 0, 0.15); color: var(--warning); white-space: nowrap; }
      .state.ok { background: rgba(0, 212, 170, 0.15); color: var(--success); }
      .gauge .v { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; color: var(--accent); }
      .card.ok .gauge .v { color: var(--success); }
      .gauge .l { font-size: 0.8rem; color: var(--text-secondary); margin: 2px 0 8px; }
      .bar { height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
      .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }
      .card.ok .bar i { background: var(--success); }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .tile { background: var(--bg-input); border-radius: 8px; padding: 8px 6px; text-align: center; min-width: 0; }
      .tile span { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile b { font-size: 1rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      @media (max-width: 374px) { .tiles { grid-template-columns: 1fr 1fr; } header { padding: 14px 12px; } }
      .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
      .ctl label { flex: 1 1 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--text-secondary); }
      .ctl input[type="range"] { flex: 1; accent-color: var(--accent); }
      .ctl label > span { min-width: 2.5em; text-align: right; color: var(--text-primary); font-variant-numeric: tabular-nums; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      /* Buttons */
      button.b {
        display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 12px;
        padding: 10px 16px; border-radius: 8px; font: inherit; font-size: 0.85rem; font-weight: 600;
        cursor: pointer; border: none; background: var(--accent); color: var(--bg-primary);
      }
      button.b.s { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); }
      button.b.d { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); }
      .row button.b, .ctl button.b, .dev button.b { margin-top: 0; }
      .ctl .row button.b { padding: 8px 6px; }
      .dev button.b, .f .row button.b { width: auto; padding: 8px 12px; font-size: 0.75rem; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      /* Toggle switch (checkboxes) */
      input[type="checkbox"] {
        appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0;
        width: 46px; height: 26px; border-radius: 13px; background: var(--border); cursor: pointer; transition: 0.2s;
      }
      input[type="checkbox"]::before {
        content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
        background: var(--text-primary); border-radius: 50%; transition: 0.2s;
      }
      input[type="checkbox"]:checked { background: var(--accent); }
      input[type="checkbox"]:checked::before { transform: translateX(20px); }
      /* Forms */
      .f { margin-bottom: 12px; }
      .f > span { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
      .f > label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
      .f > label .mute { margin-left: auto; }
      .f input:not([type="checkbox"]), .f select {
        width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text-primary); font: inherit; font-size: 0.9rem; outline: none;
      }
      .f input:focus, .f select:focus { border-color: var(--accent); }
      .f input[type="file"] { padding: 8px; font-size: 0.8rem; }
      .f small, .card > small { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
      .mute { color: var(--text-muted); font-size: 0.8rem; }
      code { font-family: ui-monospace, Menlo, monospace; }
      /* Info table (System) */
      table { width: 100%; border-collapse: collapse; }
      td { padding: 8px 0; border-bottom: 1px solid var(--border); }
      td:first-child { color: var(--text-secondary); }
      td:last-child { text-align: right; }
      tr:last-child td { border-bottom: 0; }
      /* Device lists (Bluetooth, picker) */
      .dev {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: var(--bg-input); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 0.8rem;
      }
      .dev b { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; font-weight: 600; word-break: break-all; }
      .dev > span:last-child { text-align: right; white-space: nowrap; }
      .picker { margin-top: 8px; }
      details { margin-top: 10px; font-size: 0.75rem; color: var(--text-secondary); }
      .raw { font-family: ui-monospace, Menlo, monospace; word-break: break-all; margin-top: 6px; color: var(--text-primary); }
      #toast {
        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); opacity: 0;
        background: var(--bg-card); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 20px;
        font-size: 0.85rem; color: var(--accent); transition: all 0.3s; z-index: 999; pointer-events: none;
      }
      #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
      #toast.err { border-color: var(--danger); color: var(--danger); }
      .hide { display: none; }
      /* Firmware update and event log (same block as the other devices) */
      .fwu-cur { font-size: 0.8rem; margin: 0 0 10px; }
      .fwu-hint { font-size: 0.7rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
      .fwu-chk { font-size: 0.8rem; margin: 8px 0; line-height: 1.4; }
      .fwu-chk.ok { color: var(--ok); }
      .fwu-chk.warn { color: var(--warn); }
      .fwu-chk.bad { color: var(--bad); }
      .f label:has(input:disabled) { opacity: 0.4; cursor: not-allowed; }
      .fwu-force { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; margin: 0 0 8px; }
      .fwu-log { font-size: 0.75rem; line-height: 1.4; max-height: 320px; overflow-y: auto; }
      .fwu-ev { padding: 4px 0; border-bottom: 1px solid var(--line); }
      .fwu-ev:last-child { border-bottom: 0; }
      .fwu-ev span { color: var(--mute); margin-right: 8px; white-space: nowrap; }
      .fwu-ev.bad { color: var(--bad); }
    /* camper-theme:begin */
/* VanNode design (same look as the display): calm and technical, colour means state,
   blue means control. Shared block, edit firmware/_common/web/camper-theme.css and run
   tools/common/sync_common.py; it overrides the page's own styles above it. */
:root{
 --bg-primary:#0D1115;--bg-secondary:#11161B;--bg-card:#151B21;--bg-input:#0D1115;--border:#222B34;--radius:14px;
 --accent:#4DA3F0;--accent-glow:rgba(77,163,240,.25);--success:#46B97C;--warning:#E5A23B;--danger:#E5534B;
 --text-primary:#E7ECF0;--text-secondary:#B4BEC8;--text-muted:#8B98A5;
 --water:#3E9BE0;--water-glow:rgba(62,155,224,.25);--gas:#D9893A;--grey:#8A96A3;
 --cold:#3E9BE0;--mild:#46B97C;--warm:#E5A23B;--hot:#E5534B;
 --bg:#0D1115;--bg2:#11161B;--card:#151B21;--input:#0D1115;--acc:#4DA3F0;--acc-glow:rgba(77,163,240,.25);--warn:#E5A23B;
 --ok:#46B97C;--ink:#E7ECF0;--mute:#8B98A5;--dim:#6F7C89;--line:#222B34;--r:14px;--bad:#E5534B;
 --cm-line2:#2F3A45;--cm-hi:#1C242C;--cm-acx:#06131F;color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4}
svg.i{width:20px;height:20px;flex:none;vertical-align:-4px}
.header{background:var(--bg-primary);padding:14px 16px;border-bottom:1px solid var(--border);gap:12px}
.header h1{font-size:1.15rem;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:10px;min-width:0}
.header h1 svg.i{color:var(--accent)}
.status-dots{gap:6px;font-size:.75rem;color:var(--text-primary);flex-wrap:wrap;justify-content:flex-end}
.status-dots>span{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-hi)}
.status-dot{width:8px;height:8px;margin-right:6px;background:var(--cm-line2);box-shadow:none}
.status-dot.active{background:var(--success);box-shadow:none}
.status-dot.warning{background:var(--warning)}
.tabs{background:var(--bg-primary);border-bottom:1px solid var(--border);padding:8px 8px 0;gap:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.72rem;color:var(--text-muted);border-bottom:2px solid transparent;border-radius:10px 10px 0 0;padding:8px 2px 8px;gap:4px}
.tab .ico{display:inline-flex;font-size:1.05rem}
.tab .ico svg.i{width:20px;height:20px}
.tab.active,.tab.gas.active,.tab.grey.active{color:var(--text-primary);border-bottom-color:var(--accent);background:var(--cm-hi);font-weight:600}
.tab.active .ico{color:var(--accent)}
.tab-content{padding:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title,.card-title.accent,.card-title.water,.card-title.gas{font-size:.85rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text-secondary);margin-bottom:12px}
.values-grid{gap:10px}
.value-item{background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:left}
.value-label{font-size:.75rem;color:var(--text-muted)}
.value-num{font-size:1.35rem;font-weight:600}
.info-row{padding:10px 0;font-size:.9rem}
.info-label{color:var(--text-muted)}
.form-group label{font-size:.8rem;color:var(--text-muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{min-height:40px;padding:9px 12px;background:var(--bg-input);border:1px solid var(--cm-line2);border-radius:10px;font-size:.95rem;color:var(--text-primary)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.form-hint{font-size:.78rem;color:var(--text-muted)}
.btn{min-height:44px;border-radius:10px;font-size:.95rem;font-weight:600;gap:8px}
.btn-primary{background:var(--accent);color:var(--cm-acx);border:1px solid var(--accent)}
.btn-secondary{background:var(--cm-hi);color:var(--text-primary);border:1px solid var(--cm-line2)}
.btn-danger{background:transparent;color:#F08A84;border:1px solid #5A2A2A}
.btn-small{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:9px}
.btn-row{gap:10px}
.enable-row{padding:4px 0}
.toggle{width:44px;height:26px}
.toggle span{background:var(--cm-line2);border-radius:999px}
.toggle span::before{width:20px;height:20px;left:3px;top:3px;background:#fff}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::before{transform:translateX(18px)}
.badge{border-radius:999px;padding:2px 8px;background:rgba(77,163,240,.15);color:var(--accent)}
.badge.err{background:rgba(229,83,75,.15);color:var(--danger)}
.badge.new{background:rgba(229,162,59,.15);color:var(--warning)}
.dev{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.empty{color:var(--text-muted)}
.toast{background:var(--text-primary);color:var(--bg-primary);border:0;border-radius:10px}
.toast.err{background:var(--danger);color:#fff}
.alarm-banner{background:#2A2213;border-color:#4A3A1C;color:#F6D9A3}
a{color:var(--accent)}
@media (min-width:600px){.app-wrap{max-width:560px}}
/* the same parts under other names (toolbox: header/nav, maxxfan: .dots/.dot/.ct) */
header{background:var(--bg-primary);border-bottom:1px solid var(--border)}
header h1{color:var(--text-primary);display:flex;align-items:center;gap:10px}
header h1 svg.i{color:var(--accent)}
nav{background:var(--bg-primary);border-bottom:1px solid var(--border);padding:8px 8px 0;gap:4px;scrollbar-width:none}
nav button{color:var(--text-muted);border-radius:10px 10px 0 0;font-size:.72rem}
nav button.on{color:var(--text-primary);border-bottom-color:var(--accent);background:var(--cm-hi);font-weight:600}
nav button.on .ico{color:var(--accent)}
nav button .ico{display:inline-flex}
.dots{gap:6px;font-size:.75rem;color:var(--text-primary)}
.dots>span{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-hi)}
.dot{background:var(--cm-line2);margin-right:6px;box-shadow:none}
.dot.on{background:var(--ok);box-shadow:none}
/* labels in sentence case instead of capitals, no coloured side stripes, flat fills */
.ct,.temp-name,.bat-name,.gauge-title,.grp,.wedge .wl{text-transform:none;letter-spacing:0;font-size:.85rem}
.ct{font-weight:600;color:var(--text-secondary)}
.temp-tile::before{display:none}
.temp-tile{padding:14px}
.tank-fill{background:var(--water)}
.bat::before{display:none}
.bat{padding-left:16px}
.ct.acc{color:var(--text-secondary)}
.header h1,header h1{white-space:normal}
.header h1 span,header h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h2{text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600}
.card.dev-card::before{display:none}
/* camper-theme:end */

</head>
  <body>
    <div class="app-wrap">
    <header>
      <h1 id="title"><i class="vn" aria-hidden="true"></i><span>BLE Node</span></h1>
      <div class="status-dots">
        <span id="cBle"><span class="status-dot"></span>BLE</span>
        <span id="cWifi"><span class="status-dot"></span>WiFi</span>
        <span id="cMqtt"><span class="status-dot"></span>MQTT</span>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
    </div>
    <div id="toast"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        el = (t, a = {}, ...c) => {
          const e = document.createElement(t);
          for (const k in a) {
            if (k == "on")
              for (const ev in a.on) e.addEventListener(ev, a.on[ev]);
            else if (k in e && k != "list") e[k] = a[k];
            else e.setAttribute(k, a[k]);
          }
          for (const x of c) if (x != null) e.append(x);
          return e;
        };
      let CFG = null,
        LIVE = null,
        tab = "live",
        ws = null;
      const TX = {
        34: "8,5 dBm",
        44: "11 dBm",
        52: "13 dBm",
        60: "15 dBm",
        70: "17,5 dBm",
        78: "19,5 dBm",
      };
      function toast(t, err) {
        const x = $("#toast");
        x.textContent = t;
        x.classList.toggle("err", !!err);
        x.classList.add("show");
        clearTimeout(x._t);
        x._t = setTimeout(() => x.classList.remove("show"), 2500);
      }
      async function api(url, body) {
        const r = await fetch(
          url,
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              },
        );
        let j = {};
        try {
          j = await r.json();
        } catch (e) {}
        if (!r.ok) throw new Error(j.error || r.statusText);
        return j;
      }
      function fmt(v, u) {
        if (v === null || v === undefined) return "–";
        if (typeof v == "number") v = v.toLocaleString("de-DE");
        return v + (u ? " " + u : "");
      }

      // ---------------- Navigation ----------------
      // Tab icon per plugin type (unknown types get a plug)
      const SVGP = {
        chart: "M4 4v16h16M8 15l3-4 3 3 5-6", hatch: "M3 18h18M6 18l2-7h8l2 7M9 11l3-5 3 5",
        pump: "M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z", snow: "M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9",
        fire: "M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 3-5 0 2 1 3 2 3 0-3-1-5 0-8z", plug: "M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5",
        radio: "M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0M12 12v8", wifi: "M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01",
        sliders: "M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4",
        sys: "M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4",
      };
      // stroke icons as in all VanNode pages (no emoji)
      const svg = (k) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${SVGP[k] || SVGP.plug}"/></svg>`;
      const ICONS = { rvtech: "hatch", pump: "pump", fridge: "snow", dimes: "fire", mopeka: "fire", mopeka_std: "fire", blesensor: "radio", govee: "radio", bthome: "radio", daly: "plug", ective: "plug", bm2: "plug" };
      function tabs() {
        // Devices share one tab ("Geräte": list, add / remove, then the settings of one device),
        // so the bar stays short however many devices there are
        const t = [
          ["live", "Live", "chart"],
          ["dev", "Geräte", "plug"],
          ["ble", "Bluetooth", "radio"],
          ["wifi", "WLAN", "wifi"],
          ["mqtt", "MQTT", "sliders"],
          ["sys", "System", "sys"],
        ];
        $("#nav").replaceChildren(
          ...t.map(([k, l, ico]) =>
            el(
              "button",
              {
                className: tab == k || (k == "dev" && tab.startsWith("p:")) ? "on" : "",
                title: l,
                on: {
                  click: () => {
                    tab = k;
                    render();
                  },
                },
              },
              Object.assign(el("span", { className: "ico" }), { innerHTML: svg(ico) }),
              el("span", {}, l),
            ),
          ),
        );
      }
      function render() {
        tabs();
        const m = $("#main");
        m.replaceChildren();
        if (tab == "live") renderLive();
        else if (tab == "dev") renderPlugins();
        else if (tab.startsWith("p:")) {
          const p = CFG.plugins.find((x) => "p:" + x.id == tab);
          if (p && !p.removed) renderPlugin(p);
          else {
            tab = "dev";
            return render();
          }
        }
        else if (tab == "ble") renderBle();
        else if (tab == "wifi") renderWifi();
        else if (tab == "mqtt") renderMqtt();
        else renderSys();
      }

      // ---------------- Live ----------------
      function cmd(p, k, v) {
        api("/api/cmd", { p, k, v: String(v) }).catch((e) => toast(e.message, true));
      }
      function renderLive() {
        const g = el("div", { className: "grid", id: "live" });
        $("#main").append(g);
        if (!CFG.plugins.length)
          g.append(
            el(
              "div",
              { className: "card" },
              "Noch kein Gerät angelegt – unter Geräte mit „+ Gerät hinzufügen“.",
            ),
          );
        else if (!CFG.plugins.some((p) => p.cfg.enabled))
          g.append(
            el(
              "div",
              { className: "card" },
              "Alle Geräte sind ausgeschaltet – unter Geräte einschalten.",
            ),
          );
        updateLive();
      }
      function updateLive() {
        const g = $("#live");
        if (!g || !LIVE) return;
        const a = document.activeElement;
        if (a && g.contains(a) && (a.type == "range" || a.tagName == "SELECT"))
          return; // Do not disturb an open control
        g.replaceChildren(...LIVE.plugins.filter((p) => p.enabled).map(card));
      }
      function card(p) {
        const c = el("div", { className: "card dev-card" + (p.enabled && p.ok ? " ok" : "") });
        c.append(
          el(
            "h2",
            {},
            p.name,
            el("span", {
              className: "state" + (p.ok ? " ok" : ""),
              textContent: p.enabled ? p.state || "" : "Aus",
            }),
          ),
        );
        if (!p.enabled) {
          c.append(
            el(
              "div",
              { className: "mute" },
              "Unter Geräte einschalten.",
            ),
          );
          return c;
        }
        if (p.gauge) {
          const G = p.gauge,
            min = G.min ?? 0,
            max = G.max ?? 100,
            pct =
              G.v == null
                ? 0
                : Math.max(0, Math.min(100, ((G.v - min) / (max - min)) * 100));
          c.append(
            el(
              "div",
              { className: "gauge" },
              el("div", { className: "v" }, fmt(G.v, G.unit)),
              el("div", { className: "l" }, G.label || ""),
              el(
                "div",
                { className: "bar" },
                el("i", { style: "width:" + pct + "%" }),
              ),
            ),
          );
        }
        if (p.rows)
          c.append(
            el(
              "div",
              { className: "tiles" },
              ...p.rows.map((r) =>
                el("div", { className: "tile" }, el("span", {}, r[0]), el("b", {}, fmt(r[1], r[2]))),
              ),
            ),
          );
        if (p.ctrl) {
          const box = el("div", { className: "ctl" });
          for (const x of p.ctrl) box.append(ctrl(p.id, x));
          c.append(box);
        }
        if (p.raw)
          c.append(
            el(
              "details",
              {},
              el("summary", {}, "Rohdaten"),
              el("div", { className: "raw" }, p.raw),
            ),
          );
        return c;
      }
      function ctrl(id, x) {
        if (x.t == "switch") {
          const i = el("input", {
            type: "checkbox",
            checked: !!x.v,
            on: {
              change: (e) => cmd(id, x.k, e.target.checked ? "ON" : "OFF"),
            },
          });
          return el("label", {}, x.l, i);
        }
        if (x.t == "select") {
          const o = x.o.split("|");
          const s = el(
            "select",
            { on: { change: (e) => cmd(id, x.k, e.target.value) } },
            ...o.map((t, i) =>
              el("option", { value: t, textContent: t, selected: i == x.v }),
            ),
          );
          s.style.width = "auto";
          return el("label", {}, x.l, s);
        }
        if (x.t == "buttons") {
          const d = el("div", { className: "row" });
          for (const [k, l] of x.b)
            d.append(
              el("button", {
                className: "b s",
                textContent: l,
                on: { click: () => cmd(id, x.k, k) },
              }),
            );
          d.style.flex = "1 1 100%";
          return d;
        }
        if (x.t == "slider") {
          const out = el("span", { textContent: x.v });
          const r = el("input", {
            type: "range",
            min: x.min,
            max: x.max,
            value: x.v,
            on: {
              input: (e) => (out.textContent = e.target.value),
              change: (e) => cmd(id, x.k, e.target.value),
            },
          });
          return el("label", {}, x.l + " ", r, out);
        }
        return el("span");
      }

      // ---------------- Plugin settings ----------------
      function field(f, val) {
        let i;
        if (f.t == "bool")
          i = el("input", { type: "checkbox", checked: !!val });
        else if (f.t == "select")
          i = el(
            "select",
            {},
            ...f.o
              .split("|")
              .map((t, n) =>
                el("option", { value: n, textContent: t, selected: n == val }),
              ),
          );
        else if (f.t == "float" || f.t == "int")
          i = el("input", {
            type: "number",
            min: f.min,
            max: f.max,
            step: f.t == "int" ? 1 : f.step,
            value: val,
          });
        else
          i = el("input", {
            type: "text",
            value: val ?? "",
            maxLength: f.t == "mac" ? 17 : f.max,
            placeholder: f.t == "mac" ? "AA:BB:CC:DD:EE:FF" : "",
          });
        i.dataset.k = f.k;
        i.dataset.t = f.t;
        const lab = el("span", {}, f.l + (f.u ? " (" + f.u + ")" : ""));
        const w = el("div", { className: "f" }, lab);
        if (f.t == "mac") {
          const r = el(
            "div",
            { className: "row" },
            i,
            el("button", {
              className: "b s",
              type: "button",
              textContent: "Suchen",
              style: "flex:0 0 auto",
              on: { click: () => pick(i, w) },
            }),
          );
          w.append(r);
        } else w.append(i);
        if (f.h) w.append(el("small", {}, f.h));
        return w;
      }
      function readFields(box) {
        const o = {};
        for (const i of box.querySelectorAll("[data-k]")) {
          const t = i.dataset.t;
          o[i.dataset.k] =
            t == "bool"
              ? i.checked
              : t == "select"
                ? +i.value
                : t == "int" || t == "float"
                  ? +i.value
                  : i.value.trim();
        }
        return o;
      }
      // Field descriptions: once per type in CFG.schemas (1.5.2), per device before
      const fieldsOf = (p) => (CFG.schemas && CFG.schemas[p.type]) || p.fields || [];
      function openDevice(id) {
        tab = "p:" + id;
        render();
        window.scrollTo(0, 0);
      }
      function restartButton() {
        return el("button", {
          className: "b",
          textContent: "Jetzt neu starten",
          on: {
            click: (e) => {
              e.target.disabled = true;
              api("/api/restart", {})
                .then(() => {
                  toast("Neustart…");
                  setTimeout(() => location.reload(), 8000);
                })
                .catch((x) => {
                  e.target.disabled = false;
                  toast(x.message, true);
                });
            },
          },
        });
      }
      function renderPlugin(p) {
        $("#main").append(
          el("button", {
            className: "b s",
            textContent: "← Alle Geräte",
            style: "width:auto;margin:0 0 10px;padding:4px 12px",
            on: { click: () => { tab = "dev"; render(); } },
          }),
        );
        const c = el("div", { className: "card" });
        c.append(
          el(
            "h2",
            {},
            p.cfg.name || p.type_name,
            el("span", { className: "mute", textContent: p.type_name + " · ID: " + p.id }),
          ),
        );
        if (!p.running)
          c.append(
            el(
              "div",
              { className: "f", style: "padding:10px 12px;border-radius:8px;background:rgba(229,162,59,.12)" },
              el(
                "small",
                { style: "display:block;margin-bottom:8px;color:var(--warning)" },
                p.pending
                  ? "Neu angelegt – läuft erst nach dem Neustart. Einstellungen kannst du schon jetzt speichern, mehrere neue Geräte brauchen nur einen Neustart."
                  : p.cfg.enabled
                    ? "Läuft erst nach dem Neustart. Einstellungen kannst du schon jetzt speichern."
                    : "Ausgeschaltet (unter Geräte einschalten). Einstellungen kannst du trotzdem speichern.",
              ),
              p.pending || p.cfg.enabled ? restartButton() : null,
            ),
          );
        const nm = el("input", {
          type: "text",
          value: p.cfg.name,
          maxLength: 31,
        });
        c.append(
          el(
            "div",
            { className: "f" },
            el("span", {}, "Name (Anzeige und Home Assistant)"),
            nm,
          ),
        );
        const box = el("div");
        for (const f of fieldsOf(p)) box.append(field(f, p.cfg[f.k]));
        c.append(box);
        c.append(
          el("button", {
            className: "b",
            textContent: "Speichern",
            on: {
              click: async () => {
                const cfg = readFields(box);
                cfg.name = nm.value.trim();
                try {
                  const r = await api("/api/config", { plugin: p.id, cfg });
                  toast(r.restart ? "Gespeichert – Neustart…" : "Gespeichert");
                  Object.assign(p.cfg, cfg);
                  if (r.restart) setTimeout(() => location.reload(), 8000);
                  else render();
                } catch (e) {
                  toast(e.message, true);
                }
              },
            },
          }),
        );
        $("#main").append(c);
        if (p.ble === 2) renderLog(p);
      }
      // Device log of a connecting BLE device: download as "<name>_<date>_<time>.log", or clear
      function renderLog(p) {
        const clean = (s) =>
          s
            .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
            .replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/ß/g, "ss")
            .replace(/[^A-Za-z0-9_-]+/g, "_")
            .replace(/^_+|_+$/g, "") || p.id;
        const two = (n) => String(n).padStart(2, "0");
        const download = async () => {
          try {
            const r = await fetch("/api/log?id=" + encodeURIComponent(p.id));
            if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
            const d = new Date();
            const date = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
            const time = two(d.getHours()) + "-" + two(d.getMinutes());
            const live = LIVE && LIVE.plugins ? LIVE.plugins.find((x) => x.id == p.id) : null;
            const text =
              "# Download " + d.toLocaleString("de-DE") + "\n" +
              "# Live " + JSON.stringify(live || {}) + "\n" +
              (await r.text());
            const a = el("a", {
              href: URL.createObjectURL(new Blob([text], { type: "text/plain" })),
              download: clean(p.cfg.name || p.type_name) + "_" + date + "_" + time + ".log",
            });
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          } catch (e) {
            toast(e.message, true);
          }
        };
        const clear = async () => {
          try {
            const r = await fetch("/api/log/clear?id=" + encodeURIComponent(p.id), { method: "POST" });
            if (!r.ok) throw new Error(r.statusText || "Fehler " + r.status);
            toast("Log geleert");
          } catch (e) {
            toast(e.message, true);
          }
        };
        $("#main").append(
          el(
            "div",
            { className: "card" },
            el("h2", {}, "Log"),
            el(
              "small",
              { className: "mute" },
              "Verbindung, Kopplung, Bluetooth-Dienste und empfangene Daten dieses Geräts. " +
                "Wird bei einem Neustart gelöscht. Bei Problemen: Log leeren, Fehler abwarten " +
                "(z. B. 3 Minuten), dann herunterladen und schicken.",
            ),
            el(
              "div",
              { style: "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap" },
              el("button", { className: "b", textContent: "Log herunterladen", on: { click: download } }),
              el("button", { className: "b s", textContent: "Log leeren", on: { click: clear } }),
            ),
          ),
        );
      }

      function renderPlugins() {
        const max = CFG.max_links || 3,
          maxDev = CFG.max_devices || 12,
          types = CFG.types || [];
        // Device changes are saved right away and take effect with the next restart
        // While a change is on its way all buttons of the list are locked (no double add)
        let busy = false;
        const save = async (body, msg) => {
          if (busy) return;
          busy = true;
          for (const b of $("#main").querySelectorAll("button")) b.disabled = true;
          const before = new Set(CFG.plugins.map((p) => p.id));
          try {
            await api("/api/config", body);
            toast(msg);
            await new Promise((r) => setTimeout(r, 300)); // the device applies it in its main loop
            const keep = window.scrollY;
            await load();
            // a new device: straight to its settings
            const added = body.add && CFG.plugins.find((p) => !before.has(p.id));
            if (added) openDevice(added.id);
            else window.scrollTo(0, keep);
          } catch (e) {
            toast(e.message, true);
            render();
          }
        };
        const active = CFG.plugins.filter((p) => !p.removed);
        // one line per device: switch, name, state after the restart, type, remove / undo
        const mk = (p) => {
          const i = el("input", { type: "checkbox", checked: p.cfg.enabled && !p.removed, disabled: !!p.removed });
          i.dataset.id = p.id;
          let note = "";
          if (p.removed) note = el("span", { className: "badge err", textContent: "wird entfernt" });
          else if (p.pending) note = el("span", { className: "badge new", textContent: "neu" });
          else if (p.cfg.enabled !== p.running)
            note = el("span", { className: "badge new", textContent: p.cfg.enabled ? "wird eingeschaltet" : "wird ausgeschaltet" });
          const btn = p.removed
            ? el("button", {
                className: "b s",
                title: "Doch behalten",
                textContent: "Rückgängig",
                style: "width:auto;margin:0;padding:4px 10px",
                on: { click: () => save({ restore: p.id }, "Bleibt erhalten") },
              })
            : el("button", {
                className: "b d",
                title: "Entfernen",
                textContent: "✕",
                style: "width:auto;margin:0;padding:4px 10px",
                on: {
                  click: () => {
                    if (!confirm(`„${p.cfg.name}“ entfernen? Die Einstellungen und die Einträge in Home Assistant werden gelöscht.`)) return;
                    save({ remove: p.id }, "Entfernt");
                  },
                },
              });
          return el(
            "div",
            { className: "f", style: "display:flex;gap:8px;align-items:center" + (p.removed ? ";opacity:.6" : "") },
            el(
              "label",
              { style: "display:flex;gap:8px;align-items:center;flex:1;margin:0;flex-wrap:wrap" },
              i,
              el("span", { style: p.removed ? "text-decoration:line-through" : "" }, p.cfg.name),
              note,
              el("span", { className: "mute", style: "margin-left:auto", textContent: p.type_name }),
            ),
            p.removed
              ? null
              : el("button", {
                  className: "b s",
                  title: "Einstellungen",
                  textContent: "Einstellen",
                  style: "width:auto;margin:0;padding:4px 10px",
                  on: { click: () => openDevice(p.id) },
                }),
            btn,
          );
        };
        const listen = CFG.plugins.filter((p) => p.ble !== 2).map(mk);
        const link = CFG.plugins.filter((p) => p.ble === 2).map(mk);
        const boxes = [...listen, ...link];
        const count = el("span", { className: "mute" });
        // Connections: at most `max` switched on at the same time, further switches are locked
        const linkOn = () => link.filter((b) => b.querySelector("input").checked).length;
        const check = () => {
          const on = linkOn();
          count.textContent = `${on} von ${max}`;
          for (const b of link) {
            const i = b.querySelector("input");
            const gone = CFG.plugins.find((p) => p.id === i.dataset.id).removed;
            i.disabled = gone || (!i.checked && on >= max);
          }
          for (const o of sel.options) {
            const t = types.find((x) => x.type === o.value);
            o.disabled = (t && t.ble === 2 && on >= max) || active.length >= maxDev;
          }
        };
        for (const b of link) b.querySelector("input").addEventListener("change", check);
        const group = (title, hint, items, extra) => [
          el("h3", { style: "margin:14px 0 2px;display:flex;justify-content:space-between;font-size:0.95rem" }, title, extra || ""),
          el("small", { className: "mute", style: "display:block;margin-bottom:6px" }, hint),
          ...(items.length ? items : [el("small", { className: "mute", style: "display:block" }, "– noch keins –")]),
        ];
        // "+ Gerät hinzufügen": type selection, grouped like the lists
        const sel = el("select", { style: "flex:1" });
        for (const [label, ble] of [["Mithören", 1], ["Verbinden", 2]]) {
          const g = el("optgroup", { label });
          for (const t of types.filter((t) => (t.ble === 2) === (ble === 2))) g.append(el("option", { value: t.type, textContent: t.name }));
          if (g.children.length) sel.append(g);
        }
        const add = el(
          "div",
          { className: "f row", style: "margin-top:14px;align-items:center" },
          sel,
          el("button", {
            className: "b s",
            textContent: "+ Gerät hinzufügen",
            on: {
              click: () => {
                const o = sel.selectedOptions[0];
                if (!o || o.disabled) return toast("Dieses Gerät passt gerade nicht dazu (Grenze erreicht)", true);
                save({ add: o.value }, "Hinzugefügt");
              },
            },
          }),
        );
        check();
        // Pending changes: one restart applies all of them
        const restartBox = CFG.restart_needed
          ? el(
              "div",
              { className: "f", style: "margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(229,162,59,.12)" },
              el(
                "small",
                { style: "display:block;margin-bottom:8px;color:var(--warning)" },
                "Änderungen sind gespeichert und wirken nach dem Neustart.",
              ),
              restartButton(),
            )
          : null;
        $("#main").append(
          el(
            "div",
            { className: "card" },
            el("h2", {}, "Geräte"),
            restartBox,
            ...group("Mithören", "Sensoren, die nur senden (Thermometer, Gas, eigener BLE-Sensor). Beliebig viele.", listen),
            ...group(
              "Verbinden",
              `Geräte mit fester Bluetooth-Verbindung (Batterien, Dachhaube, Pumpe, Kühlschrank). Höchstens ${max} gleichzeitig – für mehr einen zweiten Node mit eigenem Topic nehmen (z. B. battery-node mit camper/battery).`,
              link,
              count,
            ),
            add,
            el(
              "small",
              { className: "mute", style: "display:block;margin-top:8px" },
              `Insgesamt höchstens ${maxDev} Geräte. Ausgeschaltete Geräte behalten ihre Einstellungen, laufen aber nicht und fehlen in Home Assistant. Änderungen werden sofort gespeichert und wirken nach dem Neustart – mehrere Änderungen brauchen nur einen Neustart.`,
            ),
            boxes.length
              ? el("button", {
                  className: "b",
                  textContent: "An/Aus speichern",
                  on: {
                    click: () => {
                      const enabled = {};
                      for (const b of boxes) {
                        const i = b.querySelector("input");
                        if (!i.disabled || i.checked) enabled[i.dataset.id] = i.checked;
                      }
                      for (const p of CFG.plugins) if (p.removed) delete enabled[p.id];
                      save({ enabled }, "Gespeichert");
                    },
                  },
                })
              : null,
          ),
        );
      }

      // ---- Firmware update with checks, event log (same checks as fwcheck.cpp on the device) ----
      // Elements: fwu-cur, fwu-file, fwu-chk, fwu-force-row, fwu-force, fwu-btn, fwu-pr, fwu-log
      let FWI = null;   // running firmware: {dev, ver, chip, chip_id, max}
      const FW_CHIPS = {'-1': 'ESP8266', 0: 'ESP32', 2: 'ESP32-S2', 5: 'ESP32-C3', 9: 'ESP32-S3', 12: 'ESP32-C2', 13: 'ESP32-C6', 16: 'ESP32-H2'};
      const fwEl = id => document.getElementById(id);
      const fwEsc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
      function fwVerCmp(a, b) {
          const x = String(a).split('.').map(n => parseInt(n) || 0), y = String(b).split('.').map(n => parseInt(n) || 0);
          for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
          return 0;
      }
      function fwAgo(s) { return s < 90 ? s + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : s < 172800 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d'; }
      async function fwLoad() {
          try {
              const r = await fetch('/api/system', {cache: 'no-store'});
              if (!r.ok) return;
              const d = await r.json();
              FWI = d.fw || null;
              if (FWI && fwEl('fwu-cur')) fwEl('fwu-cur').innerHTML = `Installiert: <b>${fwEsc(FWI.dev)} v${fwEsc(FWI.ver)}</b> · ${FW_CHIPS[FWI.chip_id] || fwEsc(FWI.chip)} · Platz ${Math.round(FWI.max / 1024)} kB` +
            (FWI.hw ? `<br>Passende Datei aus dem Release: <b>…-node-${fwEsc(FWI.hw)}-v….bin</b>` : '');
              const box = fwEl('fwu-log');
              if (box) box.innerHTML = (d.log || []).length ? d.log.map(e => {
                  const when = e.b === 0 ? 'vor ' + fwAgo(Math.max(0, (d.up || 0) - e.t)) : (e.b === 1 ? 'vorheriger Start' : e.b + ' Starts zuvor') + ', nach ' + fwAgo(e.t);
                  const bad = /abgelehnt|fehlgeschlagen|nicht gespeichert|zurück auf|Absturz|Watchdog|Spannungseinbruch/.test(e.m);
                  return `<div class="fwu-ev${bad ? ' bad' : ''}"><span>${fwEsc(when)}</span>${fwEsc(e.m)}</div>`;
              }).join('') : '<div class="fwu-ev">Noch keine Einträge.</div>';
          } catch (e) {}
      }
      // Which release file fits this device (FW_HW of the running firmware), added to "wrong chip" errors
function fwHwHint() { return FWI && FWI.hw ? ` – passende Datei: …-node-${FWI.hw}-v….bin` : ''; }
// Checks the chosen file in the browser: {ok, kind, msg, warn, force}
      async function fwInspect(file, fsImages) {
          const n = file.name.toLowerCase(), kb = Math.round(file.size / 1024) + ' kB';
          if (n.endsWith('.gz')) return {ok: true, kind: 'web', msg: 'Web-Oberfläche (' + kb + '), ersetzt nur die Seite, ohne Neustart'};
          if (fsImages && /littlefs|spiffs/.test(n)) return {ok: true, kind: 'fs', warn: true, msg: 'Dateisystem-Abbild (' + kb + ') – ersetzt die Web-Oberfläche, danach Neustart'};
          if (!n.endsWith('.bin')) return {ok: false, msg: 'Nur .bin (Firmware) oder .gz (Web-Oberfläche)'};
          const merged = 'Das ist die .merged.bin (komplettes Flash-Abbild für USB). Bitte die .bin ohne „merged“ nehmen.';
          if (n.includes('merged')) return {ok: false, msg: merged};
          const u = new Uint8Array(await file.arrayBuffer());
          if (u.length < 64 || u[0] !== 0xE9) return {ok: false, msg: 'Keine ESP-Firmware'};
          const esp32 = !FWI || FWI.chip_id >= 0;   // ESP8266 images have no chip id and no .merged.bin
          if (esp32 && u.length > 0x8001 && u[0x8000] === 0xAA && u[0x8001] === 0x50) return {ok: false, msg: merged};
          const chip = u[12] | (u[13] << 8);
          if (FWI && esp32 && chip !== FWI.chip_id) return {ok: false, msg: `Firmware für ${FW_CHIPS[chip] || 'einen unbekannten Chip'}, dieses Gerät ist ein ${FW_CHIPS[FWI.chip_id] || FWI.chip}${fwHwHint()}`};
          if (FWI && FWI.max && u.length > FWI.max) return {ok: false, msg: `Datei zu groß (${kb}, Platz ${Math.round(FWI.max / 1024)} kB)`};
          const m = new TextDecoder('latin1').decode(u).match(/CAMPER-FW:([A-Za-z0-9_.-]{1,24}):([A-Za-z0-9_.-]{1,24}):([A-Za-z0-9_.-]{1,24});/);
          if (!m) return {ok: false, force: true, msg: 'Keine Gerätekennung in der Datei: fremde Firmware oder eine Version vor der Kennung. Nur hochladen, wenn sicher ist, dass sie für dieses Gerät ist.'};
          if (FWI && m[1] !== FWI.dev) return {ok: false, msg: `Firmware für „${m[1]}“, dieses Gerät ist „${FWI.dev}“`};
          if (FWI && m[3] !== FWI.chip) return {ok: false, msg: `Firmware für ${m[3]}, dieses Gerät ist ein ${FWI.chip}${fwHwHint()}`};
          const c = FWI ? fwVerCmp(m[2], FWI.ver) : 1;
          return {ok: true, kind: 'fw', warn: c <= 0, msg: `Firmware ${m[1]} v${m[2]} (${kb}) – ` +
              (c > 0 ? 'neuer als die installierte' : c === 0 ? 'gleiche Version wie installiert' : 'ÄLTER als die installierte (Downgrade)')};
      }
      let fwPick = null;
      async function fwChosen(fsImages) {
          const f = fwEl('fwu-file').files[0], chk = fwEl('fwu-chk');
          fwPick = null;
          fwEl('fwu-force-row').style.display = 'none';
          fwEl('fwu-force').checked = false;
          if (!f) { chk.textContent = ''; fwEl('fwu-btn').disabled = true; return; }
          chk.className = 'fwu-chk'; chk.textContent = 'Prüfe …';
          const r = await fwInspect(f, fsImages);
          fwPick = r;
          chk.textContent = (r.ok ? (r.warn ? '⚠ ' : '✓ ') : '✕ ') + r.msg;
          chk.className = 'fwu-chk ' + (r.ok ? (r.warn ? 'warn' : 'ok') : 'bad');
          if (r.force) fwEl('fwu-force-row').style.display = '';
          fwEl('fwu-btn').disabled = !r.ok;
      }
      function fwForce() { fwEl('fwu-btn').disabled = !(fwPick && (fwPick.ok || (fwPick.force && fwEl('fwu-force').checked))); }
      function fwUpload(field, toast) {
          const f = fwEl('fwu-file').files[0];
          if (!f || !fwPick) { toast('Erst eine Datei wählen', true); return; }
          if (fwPick.warn && fwPick.kind === 'fw' && !confirm(fwPick.msg + '\nTrotzdem installieren?')) return;
          const force = !fwPick.ok && fwPick.force && fwEl('fwu-force').checked;
          const fd = new FormData();
          fd.append(field, f);
          const x = new XMLHttpRequest(), pr = fwEl('fwu-pr');
          pr.classList.remove('hide', 'hidden'); pr.style.display = ''; pr.value = 0;
          fwEl('fwu-btn').disabled = true;
          x.upload.onprogress = e => { if (e.lengthComputable) pr.value = e.loaded / e.total * 100; };
          x.onload = () => {
              if (x.status === 200 && x.responseText === 'OK web') { toast('Web-Oberfläche ersetzt – lädt neu …'); setTimeout(() => location.reload(), 1500); return; }
              if (x.status === 200) { toast('Update ok – Neustart …'); setTimeout(() => location.reload(), 15000); return; }
              toast(x.responseText || ('Fehler HTTP ' + x.status), true);
              const chk = fwEl('fwu-chk'); chk.textContent = '✕ ' + (x.responseText || 'Fehler HTTP ' + x.status); chk.className = 'fwu-chk bad';
              fwEl('fwu-btn').disabled = false;
              fwLoad();
          };
          x.onerror = () => { toast('Verbindung abgebrochen', true); fwEl('fwu-btn').disabled = false; fwLoad(); };
          x.open('POST', '/api/update' + (force ? '?force=1' : ''));
          x.send(fd);
      }
      setInterval(() => { if (fwEl('fwu-log')) fwLoad(); }, 15000);

      // ---------------- Data ----------------
      function chips() {
        if (!LIVE) return;
        const s = (id, ok, title) => {
          const e = $(id);
          e.firstChild.className = "status-dot" + (ok ? " active" : " bad");
          e.title = title;
        };
        s("#cWifi", LIVE.rssi != 0, LIVE.rssi ? "WLAN " + LIVE.rssi + " dBm" : String(LIVE.wifi || ""));
        s("#cMqtt", LIVE.mqtt, LIVE.mqtt ? "MQTT verbunden" : "MQTT getrennt");
        const b = $("#cBle");
        if (LIVE.ble) {
          b.classList.remove("hide");
          b.firstChild.className = "status-dot" + (LIVE.ble.scanning ? " active" : "");
        } else b.classList.add("hide");
      }
      function connect() {
        ws = new WebSocket(
          (location.protocol == "https:" ? "wss://" : "ws://") +
            location.host +
            "/ws",
        );
        ws.onmessage = (e) => {
          LIVE = JSON.parse(e.data);
          chips();
          if (tab == "live") updateLive();
        };
        ws.onclose = () => setTimeout(connect, 3000);
      }
      async function load() {
        const c = await api("/api/config");
        if (!Array.isArray(c.plugins)) throw new Error("Einstellungen unvollständig empfangen – bitte neu laden");
        CFG = c;
        $("#title span").textContent = CFG.device;
        document.title = CFG.device;
        render();
      }
      load()
        .then(connect)
        .catch((e) => {
          $("#main").textContent = "Fehler: " + e.message;
        });
    // vannode-about:begin

  // firmware id (FW_DEVICE) -> name, repo folder, third-party parts in this firmware
  const DEV = {

      'Mopeka-Dekodierung nach ' + A('https://github.com/Bluetooth-Devices/mopeka-iot-ble', 'mopeka-iot-ble') + ' (MIT, eigene Umsetzung)']},

    toolbox:   {n: 'BLE-Node', d: 'ble', x: [
      'Batterie-Protokolle (Daly, Ective, BM2) portiert aus ' + A('https://github.com/patman15/aiobmsble', 'aiobmsble') + ' (Apache-2.0)',

    heater:    {n: 'Heater-Node', d: 'heater', x: [

  };
  DEV.ble = DEV.toolbox;   // mockups use the folder name
  DEV.template = DEV.example;
  const HW = {esp32: 'ESP32', esp32c3: 'ESP32-C3', esp32s3: 'ESP32-S3', esp32c6: 'ESP32-C6', esp8266: 'ESP8266', atoms3: 'AtomS3', core2: 'Core2'};
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function card(upd, fw) {

    const c = document.createElement('div');

    if (t) title.className = t.className;

    c.append(title);
    c.insertAdjacentHTML('beforeend',
      '<i class="vnlogo" role="img" aria-label="VanNode" style="margin:4px 0 10px"></i>' +
      '<p style="margin:6px 0"><b>' + esc(info.n) + '</b> · Firmware ' + esc(fw.ver || '--') + (fw.hw ? ' · ' + esc(HW[fw.hw] || fw.hw) : '') + '</p>' +
      '<p style="margin:6px 0">' + COPY + '<br>Teil von VanNode – Camper-Elektronik über MQTT<br>' + A(REPO, 'github.com/hflocki/vannode') + '</p>' +

  let fw = null, busy = false;
  function place() {
    const cur = document.getElementById('fwu-cur');
    const upd = cur && cur.closest('.card');
    if (!upd || document.getElementById('vn-about')) return;
    if (fw) return card(upd, fw);
    if (busy) return;
    busy = true;
    fetch('/api/system', {cache: 'no-store'}).then((r) => r.json()).then((j) => { fw = j.fw || {}; })
      .catch(() => { fw = {}; }).finally(() => { busy = false; place(); });
  }
  // The update card is built by the page (sometimes only when its tab opens): watch for it
